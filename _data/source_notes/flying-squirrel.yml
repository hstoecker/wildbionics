  claims:
    - "Most diverse gliding mammals; 11.63 Ma, Abocador de Can Mata, more than 80 bones; 1339 g estimate; gliding wrist features; ~23 Ma molecular, older dates, ~36 Ma fossils; teeth not unique; little change for almost 12 Myr"
