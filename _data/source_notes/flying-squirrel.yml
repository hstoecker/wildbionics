# Where the claims of "Flying Squirrel: The Glide That Ends Going Up" come from – written while researching,
# read by the review (wildbionics-review). All DOIs resolved at Crossref (sources.py, 2026-11-08).
# Derived numbers (equilibrium angle and speed, forward/rearward force ratio, the speed factor from wing loading,
# everything printed by squirrel_glide.py) are calculations for this article and labelled so in the text.
# Bahlman: Results give CL 0.01 / CD 0.05 for the first 3 m, the Discussion CL 0.05 / CD 0.05; both are tested in the program.
"10.1098/rsif.2012.0794":
  read: "Full text (pmc.ncbi.nlm.nih.gov/articles/PMC3565731, methods, results, discussion)"
  claims:
    - "Gliding in every major group of terrestrial vertebrates; no equilibrium at any point; lift exceeds body weight – abstract, 3.1, 3.2"
    - "Maine; 59 recorded, 58 to six trees; at least six individuals; 7–20 m – 2.1, 3.1"
    - "m 92.7 g from another population, wing loading 59 N/m², S 154 cm², rho 1.204 – 2.6"
    - "Tree 5 (18 m, n = 23): height change 7.6 ± 0.5 m, GR 2.4 ± 0.2 – Table 1; mean glide velocity 7.2 m/s; about 45° on entry; gaining altitude at landing – 3.2"
    - "CL 1.4 on entry, about +300 % by landing; CD 0.78, +25 % over 10 m, then towards zero; L/D start 1.5 – 3.2; 95 % CI at end CL 0.56, CD 0.27 – Table 2"
    - "Launch 5.4 m/s, range 3.3–8.4, n = 5; best match 5.37 m/s – 3.3, 3.4"
    - "Peak about 8.5 m/s between 5 and 6 m; forward lift component about twice rearward drag; CL +50 %, CD +25 % in middle phase; final third high CL low CD; landing as end product, not stall; body vertical – 4.2"
    - "Membrane may be partly open in the first metres – 4.2; first 3 m not filmed – 3.4, 4.2"
    - "Equilibrium within 16 m / 8 m for all simulations; about half of the glides 10 m or shorter – 4.1"
    - "AGV +27 % at equal GR, GR +46 % at equal AGV – 3.4"
    - "Glides do not maximise GR; faster commute reduces exposure to predators; no constant-coefficient simulation superior on both GR and AGV – 4.4"
    - "Total energy decreases over all glides – 3.2; ways to change wing shape – 1.2; high CL, partly separated flow, leading-edge vortices – 4.3"
