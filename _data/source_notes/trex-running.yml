# Where the claims of "How fast was T. rex?" come from – written while researching, read by the
# review (wildbionics-review). One entry per source, keyed by DOI: what was read, and which claims
# rest on it. All DOIs resolved at Crossref (sources.py, 2026-10-08). Abstracts from OpenAlex/PubMed;
# full texts from Europe PMC / PMC where open access. Nature, Science, Wiley, JEB, ACS and
# American Mineralogist pages were behind a bot check or paywall, so for those only the abstract was
# read. Alexander (1976, Nature 261:129) itself could not be read (no abstract, paywall) and is not
# cited: his rule λ/h ≈ 2.3 (v²/gh)^0.3 is taken from Sellers & Manning 2007 (full text), the trackway
# formula S ≈ 3.6 · 0.783 λ^1.67 h^-1.17 km/h from McCrea et al. 2014 (equation 1, read as image),
# the history and the factor-1.5 scatter from Alexander 2006 (full text). The step from the rule to
# v ≈ 0.25 √g λ^1.67 h^-1.17 is derived in the article (0.25 · √9.81 = 0.783, as in McCrea).
