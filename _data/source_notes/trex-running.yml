    - "Collagen I, the main organic component of bone, preserved in low concentrations in MOR 1125 tissues – abstract"
"10.1126/science.1137614":
  read: "Abstract (OpenAlex)"
  claims:
    - "Protein sequences from a 68-million-year-old Tyrannosaurus rex by mass spectrometry – abstract"
"10.1126/science.1147046":
  read: "Abstract (OpenAlex)"
  claims:
    - "Authentication tests from ancient DNA: mastodon samples pass, T. rex does not (no amino acid composition data, no deamidation evidence, collagen sequences associated with amphibians rather than birds) – abstract"
"10.1021/pr900349r":
  read: "Abstract (OpenAlex)"
