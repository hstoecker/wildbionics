"10.1371/journal.pone.0002808":
  read: "Full text (Europe PMC)"
  claims:
    - "Coatings found extensively in porous trabecular bone of many dinosaur and mammal species, interpreted as bacterial biofilms – abstract"
    - "Carbon dating points to relatively modern origin; blood-cell-size iron–oxygen spheres = oxidized former pyrite framboids – abstract"
"10.7554/elife.46205":
