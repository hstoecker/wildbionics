      chart_height: 518
      chart_label: "Abb. 2"
      chart_caption: "Ausgabe des Programms oben: die Reynolds-Zahlen von fünf Schwimmern auf einer logarithmischen Achse. Links der gestrichelten Linie bei Re = 1 gewinnt die Zähigkeit, rechts davon die Trägheit. Größen, Geschwindigkeiten und die Dichte von Honig sind typische Werte zur Veranschaulichung."
      chart_alt: "Punktdiagramm auf einer logarithmischen Achse von 10 hoch minus 6 bis 10 hoch 8. Ein schattierter Bereich links einer gestrichelten Linie bei Re = 1 ist mit Zähigkeit gewinnt beschriftet, der Bereich rechts mit Trägheit gewinnt. Ein Mensch, der in Wasser schwimmt, liegt bei etwa 2 Millionen, ein Goldfisch bei etwa 5.000, ein Mensch, der in Honig schwimmt, bei etwa 400 – alle auf der Seite der Trägheit. Ein Mensch in Honig mit 1 Zentimeter pro Minute liegt bei etwa 0,07, E. coli in Wasser bei etwa 0,00006 – beide auf der Seite der Zähigkeit."
      variants: {"coli-honey": {"with": "COLI_FLUID = HONEY", "output": "Mensch in Wasser            Re =    2e+06\nGoldfisch                   Re =    5e+03\nMensch in Honig             Re =    4e+02\nMensch in Honig, 1 cm/min   Re =     0.07\nE. coli                     Re =    1e-08\nE. coli steht nach 0.2 µs still und gleitet 0.07 Å weit (ein Atom ist grob 1 Å groß)"}, "faster": {"with": "0.01", "output": "Mensch in Wasser            Re =    2e+06\nGoldfisch                   Re =    5e+03\nMensch in Honig             Re =    4e+02\nMensch in Honig, 1 cm/min   Re =        4\nE. coli                     Re =    6e-05\nE. coli steht nach 0.2 µs still und gleitet 0.07 Å weit (ein Atom ist grob 1 Å groß)"}}
    "run_and_tumble.py":
      output: "Zufallsbewegung: D = 195 µm²/s (Formel v²τ/2 = 200 µm²/s)\nmit der Regel: Drift 4.3 µm/s (Formel 4.2 µm/s), 21 % der Schwimmgeschwindigkeit\nnach 100 s ist die mittlere Zelle 416 µm weiter oben im Gefälle"
      py: "/examples/bacteria-low-reynolds/run_and_tumble.de.py"
      notebook: "examples/bacteria-low-reynolds/run_and_tumble.de.ipynb"
      chart: "/examples/bacteria-low-reynolds/run_and_tumble.de.svg"
      chart_width: 614
      chart_height: 806
      chart_label: "Abb. 3"
      chart_caption: "Ausgabe des Programms oben. Oben: die Bahnen von drei simulierten Bakterien über 60 Sekunden; gerade Läufe wechseln sich mit Taumeln ab, rechts liegt mehr Nahrung. Unten: die mittlere Position von 2.000 Bakterien über die Zeit – mit der Regel (Läufe hinauf dauern länger) driftet die Population stetig das Gefälle hinauf, ohne sie bleibt sie, wo sie gestartet ist."
      chart_alt: "Zwei Diagramme übereinander. Oben: drei Zickzackbahnen, die im Ursprung beginnen und aus geraden Stücken unterschiedlicher Länge bestehen; nach 60 Sekunden enden sie etwa 250 bis 420 Mikrometer rechts vom Start. Unten: mittlere Position entlang x über 100 Sekunden; eine durchgezogene Linie für die Population mit der Regel steigt gleichmäßig auf etwa 416 Mikrometer, eine gestrichelte Linie für die Population ohne Regel bleibt nahe null."
      variants: {"off": {"with": "BOOST = 1.0 ", "output": "Zufallsbewegung: D = 195 µm²/s (Formel v²τ/2 = 200 µm²/s)\nmit der Regel: Drift 0.0 µm/s (Formel 0.0 µm/s), 0 % der Schwimmgeschwindigkeit\nnach 100 s ist die mittlere Zelle -5 µm weiter oben im Gefälle"}, "strong": {"with": "BOOST = 4.0 ", "output": "Zufallsbewegung: D = 195 µm²/s (Formel v²τ/2 = 200 µm²/s)\nmit der Regel: Drift 7.6 µm/s (Formel 7.6 µm/s), 38 % der Schwimmgeschwindigkeit\nnach 100 s ist die mittlere Zelle 746 µm weiter oben im Gefälle"}}
