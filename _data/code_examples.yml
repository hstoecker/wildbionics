bat-echolocation:
  de:
    "range_resolution.py":
      output: "Sweep: Bandbreite 40.0 kHz, Entfernungsauflösung etwa 0.4 cm\n  2 Echos bei 1.50 m, 1.55 m, größter Fehler 0.0 cm\nTon: Bandbreite 0.5 kHz, Entfernungsauflösung etwa 34.3 cm\n  2 Echos bei 1.43 m, 1.62 m, größter Fehler 7.3 cm\nZiele: 1.50 m, 1.55 m\nFledermäuse unterscheiden Entfernungen, die 1–3 cm auseinanderliegen (Simmons 1973)"
      py: "/examples/bat-echolocation/range_resolution.de.py"
      notebook: "examples/bat-echolocation/range_resolution.de.ipynb"
      chart: "/examples/bat-echolocation/range_resolution.de.svg"
      chart_width: 614
      chart_height: 730
      chart_label: "Abb. 2"
      chart_caption: "Ausgabe des Programms oben: die Einhüllende des Optimalfilter-Ausgangs über der Entfernung für zwei Ziele im Abstand von 5 cm (gepunktete Linien). Oben: Ein Sweep von 80 auf 40 kHz ergibt zwei scharfe Spitzen genau an den Zielen. Unten: Ein reiner 60-kHz-Ton gleicher Dauer ergibt zwei breite Buckel an den falschen Stellen – die überlappenden Echos interferieren. Die Signale sind simuliert."
      chart_alt: "Zwei übereinanderliegende Liniendiagramme des Optimalfilter-Ausgangs von 0 bis 1 über der Entfernung von 1,2 bis 1,85 Metern, mit gepunkteten senkrechten Linien an den wahren Zielen bei 1,50 und 1,55 Metern. Oben, für einen Sweep von 80 auf 40 Kilohertz: Zwei schmale Spitzen der Höhe 1 liegen genau auf den gepunkteten Linien, das Rauschen daneben bleibt unter 0,1. Unten, für einen reinen 60-Kilohertz-Ton: Zwei breite Buckel haben ihr Maximum bei etwa 1,43 und 1,62 Metern, mehrere Zentimeter neben den wahren Zielen, mit einer Senke dazwischen."
      variants: {"close": {"with": "TARGETS = [1.50, 1.51]", "output": "Sweep: Bandbreite 40.0 kHz, Entfernungsauflösung etwa 0.4 cm\n  2 Echos bei 1.50 m, 1.51 m, größter Fehler 0.1 cm\nTon: Bandbreite 0.5 kHz, Entfernungsauflösung etwa 34.3 cm\n  1 Echo(s) bei 1.43 m statt 2\nZiele: 1.50 m, 1.51 m\nFledermäuse unterscheiden Entfernungen, die 1–3 cm auseinanderliegen (Simmons 1973)"}, "noise": {"with": "NOISE = 1.0", "output": "Sweep: Bandbreite 40.0 kHz, Entfernungsauflösung etwa 0.4 cm\n  2 Echos bei 1.50 m, 1.55 m, größter Fehler 0.0 cm\nTon: Bandbreite 0.5 kHz, Entfernungsauflösung etwa 34.3 cm\n  2 Echos bei 1.42 m, 1.62 m, größter Fehler 8.0 cm\nZiele: 1.50 m, 1.55 m\nFledermäuse unterscheiden Entfernungen, die 1–3 cm auseinanderliegen (Simmons 1973)"}, "longer": {"with": "CALL_TIME = 5e-3", "output": "Sweep: Bandbreite 40.0 kHz, Entfernungsauflösung etwa 0.4 cm\n  2 Echos bei 1.50 m, 1.55 m, größter Fehler 0.0 cm\nTon: Bandbreite 0.2 kHz, Entfernungsauflösung etwa 85.8 cm\n  1 Echo(s) bei 1.31 m statt 2\nZiele: 1.50 m, 1.55 m\nFledermäuse unterscheiden Entfernungen, die 1–3 cm auseinanderliegen (Simmons 1973)"}}
  en:
    "range_resolution.py":
      output: "sweep: bandwidth 40.0 kHz, range resolution about 0.4 cm\n  2 echoes at 1.50 m, 1.55 m, largest error 0.0 cm\ntone: bandwidth 0.5 kHz, range resolution about 34.3 cm\n  2 echoes at 1.43 m, 1.62 m, largest error 7.3 cm\ntargets: 1.50 m, 1.55 m\nbats tell apart range differences of 1–3 cm (Simmons 1973)"
