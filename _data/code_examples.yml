      chart_alt: "Two charts stacked. Top: three zigzag paths starting at the origin, made of straight segments of different lengths, which over 60 seconds end between about 250 and 420 micrometres to the right of the start. Bottom: average position along x over 100 seconds; a solid line for the population with the rule rises steadily to about 416 micrometres, a dashed line for the population without the rule stays near zero."
