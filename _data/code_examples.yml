      chart_caption: "Output of the program above: the envelope of the matched filter output over distance for two targets 5 cm apart (dotted lines). Top: a sweep from 80 to 40 kHz gives two sharp peaks exactly at the targets. Bottom: a pure 60 kHz tone of the same duration gives two broad humps in the wrong places – the overlapping echoes interfere. Signals are simulated."
      chart_alt: "Two line charts stacked vertically, both showing the matched filter output from 0 to 1 over distance from 1.2 to 1.85 metres, with dotted vertical lines at the true targets at 1.50 and 1.55 metres. Top, for a sweep from 80 to 40 kilohertz: two narrow peaks of height 1 sit exactly on the dotted lines, and the noise elsewhere stays below 0.1. Bottom, for a pure 60 kilohertz tone: two broad humps peak at about 1.43 and 1.62 metres, several centimetres outside the true targets, with a dip between them."
