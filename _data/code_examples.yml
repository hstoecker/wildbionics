      chart_caption: "Output of the program above: the fraction of “yes” answers for two tests on 1,000 boxes each, over time in units of the decoherence time τ. Dashed line and squares: “alive or dead?” stays at 50 % throughout. Solid line and dots: the interference test starts at 100 % for the superposition and falls to 50 % – the value for a box that is simply alive or dead – as decoherence destroys the coherence. Lines are theory, symbols simulated measurements."
