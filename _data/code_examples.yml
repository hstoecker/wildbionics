      notebook: "examples/pistol-shrimp-cavitation/rayleigh_plesset.de.ipynb"
      chart: "/examples/pistol-shrimp-cavitation/rayleigh_plesset.de.svg"
      chart_width: 614
      chart_height: 806
      chart_label: "Abb. 4"
