# Ontology terms used in article front matter (`dimensions:`) and in the knowledge graph.
#   dim   – which of the four dimensions the term belongs to
#           (time | space | physics | adjacent_sciences; `physics` = "Rules")
#   order – time terms only: position on the time axis (Big Bang → … → future)
#   en/de – display names (every language in _config.yml `languages`)
#   wikidata – optional Wikidata item that is exactly this concept (verified label + description);
#           becomes schema.org sameAs in /graph.jsonld. Leave it out when no item matches exactly.
# Slugs are language-neutral. Add every new slug here; the terminology gate checks it.

# --- Time: evolution & geology, continued into technology -------------------------
