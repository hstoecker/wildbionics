seagrass:                { dim: space, en: "Seagrass meadows", de: "Seegraswiesen" }
lab:                     { dim: space, en: "Laboratory", de: "Labor" }
microcosm:               { dim: space, en: "Microcosm", de: "Mikrokosmos" }
outer-space:             { dim: space, en: "Outer space", de: "Weltraum" }

