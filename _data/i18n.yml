    gecko:
      title: "Tokay gecko on a wall, with a zoom into its toe pads"
      desc: "A tokay gecko seen from behind, clinging head-up to a vertical wall with the broad adhesive pads of its toes. Three magnified views zoom into one toe: its underside is covered with overlapping plates, the lamellae; each lamella carries many hair-like setae, 30 to 130 micrometres long; each seta branches into hundreds of flat tips, the spatulae, 0.2 to 0.5 micrometres wide. The spatulae lie so close to the wall that van der Waals forces between their molecules and those of the wall hold the gecko."
