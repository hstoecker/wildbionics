        examples: ["Bionik", "Physical AI", "Robotik"]
  flagship:
    eyebrow: "Schwerpunktartikel"
    title: "Der Knallkrebs und die Physik der Kavitation"
    text: "Mit einem einzigen Zuschnappen seiner übergroßen Schere schießt ein nur wenige Zentimeter großer Krebs einen Wasserstrahl ab – so schnell, dass der Druck dahinter unter den Dampfdruck fällt. Eine Blase entsteht und kollabiert, und für einen winzigen Moment erreicht ihr Kern Tausende Kelvin und sendet einen Lichtblitz aus."
    stats:
      - value: "≈ 25 m/s"
        label: "Geschwindigkeit des Wasserstrahls"
      - value: "≥ 5.000 K"
        label: "im Inneren der kollabierenden Blase"
      - value: "3–5 cm"
        label: "Körperlänge des Krebses"
    tags: ["Korallenriffe", "Strömungsmechanik", "Thermodynamik", "Akustik", "Bionik"]
    sources_label: "Quellen"
    cta: "Artikel lesen"
    fig_label: "Abb. 2"
    fig_caption: "Leben einer Kavitationsblase: schnelles Wachstum, heftiger Kollaps, schwache Nachschwingungen. Der ganze Zyklus dauert weniger als eine Millisekunde."
    svg_title: "Radius einer Kavitationsblase im Zeitverlauf"
    svg_desc: "Der Blasenradius steigt nach dem Zuschnappen an und fällt dann steil auf null ab. Beim Kollaps entstehen ein Lichtblitz und eine Stoßwelle, danach folgen zwei kleine Nachschwingungen."
    svg_radius: "Radius R"
    svg_time: "Zeit t"
    svg_snap: "Zuschnappen"
    svg_growth: "Dampfblase wächst"
    svg_collapse: "Kollaps"
    svg_flash: "Lichtblitz & Stoßwelle"
  contribute:
    eyebrow: "Open Source"
    title_html: "<span class=\"line\">Offen entwickelt.</span> <span class=\"line\">Von Neugierigen geschrieben.</span>"
    text: "WildBionics lebt auf GitHub. Alles – Artikel, Übersetzungen, Code – ist offen: zum Lesen, Weiterverwenden und Verbessern."
    ways:
      - key: write
        title: "Einen Artikel schreiben"
