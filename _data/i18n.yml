    cta_guide: "CONTRIBUTING.md lesen"
    ways:
      - id: "claude-code"
        icon: "terminal"
        ribbon: "Empfohlen"
        title: "Mit Claude Code arbeiten"
        best: "Der empfohlene Weg: Claude recherchiert, schreibt und prüft – du steuerst jeden Schritt."
        badges: ["Claude Pro oder Max", "Browser, App oder Terminal", "Volle Kontrolle"]
        time: "etwa 20 Minuten Einrichtung (einmalig)"
        who: "Alle mit eigenem Claude-Abo – der empfohlene Weg, um mitzumachen."
        needs: "Ein GitHub-Konto mit Einladung ins Repository und Claude Pro, Max, Team oder Enterprise."
        tip: "Unter Windows nimm claude.ai/code: Die Skills sind per Symlink verknüpft, und Windows checkt diese manchmal falsch aus."
        steps:
          - { t: "GitHub-Konto anlegen und einladen lassen", d: "Kostenlos auf <a href=\"https://github.com/signup\">github.com/signup</a>. Dann im <a href=\"https://github.com/hstoecker/wildbionics/issues/new\">Repository</a> ein Issue mit dem Titel „Collaborator request“ und deinem GitHub-Benutzernamen öffnen – oder den Maintainer direkt fragen – und die Einladung über die E-Mail von GitHub oder unter <a href=\"https://github.com/hstoecker/wildbionics/invitations\">github.com/hstoecker/wildbionics/invitations</a> annehmen." }
          - { t: "Bei Claude anmelden und GitHub verbinden", d: "<a href=\"https://claude.ai/code\">claude.ai/code</a> öffnen, mit deinem Claude-Abo anmelden und, wenn gefragt, <strong>GitHub verbinden</strong>. Nimm vorher die Einladung an: Bis dahin taucht <code>hstoecker/wildbionics</code> nicht in der Repository-Liste auf. Fehlt es danach immer noch, GitHub unter <a href=\"https://claude.ai/connect-github\">claude.ai/connect-github</a> neu verbinden." }
          - { t: "Cloud-Umgebung „WildBionics“ anlegen (einmalig)", d: "Jede Sitzung läuft auf einem frischen Cloud-Rechner; seine <em>Umgebung</em> legt fest, welche Websites er erreichen darf und was installiert ist. Umgebungsauswahl neben dem Eingabefeld → <strong lang=\"en\">Add cloud environment</strong> (eine bestehende ändern: Umgebungsmenü in der Titelleiste der Sitzung → <strong lang=\"en\">Edit</strong>). Vier Felder ausfüllen:<dl class=\"guide-fields\"><div><dt>Name</dt><dd><code>WildBionics</code></dd></div><div><dt lang=\"en\">Network access</dt><dd><strong lang=\"en\">Custom</strong>, Haken bei <em lang=\"en\">Also include default list of common package managers</em> (RubyGems, für Jekyll) und diese Domains erlauben – ohne sie kann Claude keine Quellen prüfen (Crossref, DOI, PubMed, Semantic Scholar, Wikidata, Wikipedia):<pre class=\"guide-code\"><code>api.crossref.org\ndoi.org\neutils.ncbi.nlm.nih.gov\npubmed.ncbi.nlm.nih.gov\nwww.ncbi.nlm.nih.gov\napi.semanticscholar.org\nwww.wikidata.org\n*.wikipedia.org</code></pre></dd></div><div><dt lang=\"en\">Environment variables</dt><dd><pre class=\"guide-code\"><code>LANG=C.UTF-8</code></pre>Der Cloud-Rechner hat standardmäßig kein UTF-8-Locale – ohne diese Zeile stürzen Jekyll und die Prüfungen beim ersten Umlaut ab.</dd></div><div><dt lang=\"en\">Setup script</dt><dd><pre class=\"guide-code\"><code>#!/bin/bash\nset -e\ngem install github-pages -v 232 --no-document\nln -sf \"$(ruby -e 'print Gem.bindir')/jekyll\" /usr/local/bin/jekyll\npython3 -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 fonttools==4.54.1 brotli==1.1.0</code></pre>Installiert Jekyll in genau den Versionen, die GitHub Pages verwendet. Die <code>ln</code>-Zeile legt <code>jekyll</code> in den Suchpfad – der Cloud-Rechner installiert Gem-Programme in einen Ordner, den die Shell nicht durchsucht. Die letzte Zeile installiert die Python-Bibliotheken für die Code-Beispiele, in den Versionen der CI.</dd></div></dl>Dann <strong lang=\"en\">Create environment</strong>. Für Screenshots brauchst du nichts weiter: Chromium ist vorinstalliert." }
          - { t: "Sitzung starten", d: "Mit dem Knopf unten – Repository und Umgebung sind vorausgewählt. Oder selbst <code>hstoecker/wildbionics</code> (Branch <code>main</code>) und die Umgebung <em>WildBionics</em> wählen.", cta: true }
          - { t: "Einrichtung prüfen", d: "Schick das als erste Nachricht:<pre class=\"guide-code\"><code>Führe alle lokalen Prüfungen aus CLAUDE.md aus und prüfe, ob api.crossref.org erreichbar ist.</code></pre>Alle fünf Prüfungen sollten 0 Fehler melden. Wenn nicht: siehe „Wenn etwas nicht klappt“ unten." }
          - { t: "Aufgabe beschreiben", d: "Zum Beispiel:<pre class=\"guide-code\"><code>Schreibe einen neuen WildBionics-Artikel darüber, wie Fledermäuse ihre Beute mit Echoortung finden. Beginne mit dem Skill wildbionics-contribute und folge den Skills article, figures, translate und graph.</code></pre>" }
          - { t: "Mit Claude zusammenarbeiten", d: "Beantworte Rückfragen, lass dir Abbildungen und Seiten als Screenshots zeigen, und zum Schluss: „Führe alle Prüfungen aus und prüfe deine Arbeit mit wildbionics-review.“" }
          - { t: "Änderungen prüfen", d: "Über die Anzeige <strong>+/−</strong> die Änderungen öffnen. Einzelne Zeilen kommentieren, wenn sich etwas ändern soll." }
          - { t: "Pull Request erstellen", d: "Oben in der Änderungsansicht auf <strong lang=\"en\">Create PR</strong> klicken. Nach etwa 3 Minuten sind die Prüfungen fertig, und Claude hat ein Review geschrieben; Screenshots der neuen Seiten findest du unter <strong lang=\"en\">Checks → Build, check &amp; deploy → Artifacts → preview-pr-…</strong>. Bitte Claude in der Sitzung, Hinweise zu beheben – es pusht in denselben Pull Request. Der Maintainer gibt frei; wenige Minuten nach dem Merge ist dein Beitrag online." }
          - { t: "Wenn etwas nicht klappt", d: "<dl class=\"guide-fields guide-fields--fix\"><div><dt>„<span lang=\"en\">invalid byte sequence in US-ASCII</span>“</dt><dd>Die Umgebungsvariable <code>LANG=C.UTF-8</code> fehlt.</dd></div><div><dt>„<span lang=\"en\">bundler: command not found: jekyll</span>“</dt><dd>Das Setup-Skript fehlt oder ist fehlgeschlagen – in den Einstellungen der Umgebung prüfen.</dd></div><div><dt>Crossref, DOI oder PubMed gesperrt (403, „<span lang=\"en\">host not allowed</span>“)</dt><dd>Network access steht nicht auf <strong lang=\"en\">Custom</strong>, oder die Domain fehlt in der Liste.</dd></div><div><dt>Repository fehlt in der Liste, Push abgelehnt</dt><dd>Einladung annehmen, dann GitHub neu verbinden.</dd></div><div><dt>Umgebung geändert, nichts passiert</dt><dd>Einstellungen gelten nur für neue Sitzungen – eine neue starten.</dd></div></dl>Kommst du nicht weiter? Öffne ein Issue mit der Fehlermeldung." }
          - { t: "Optional: auf dem eigenen Rechner", d: "Repository klonen und Claude Code darin starten – die Skills laden automatisch:<pre class=\"guide-code\"><code>git clone https://github.com/hstoecker/wildbionics.git\ncd wildbionics\nclaude</code></pre>Die Plugin-Befehle <code>/plugin marketplace add hstoecker/wildbionics</code> und <code>/plugin install wildbionics@wildbionics</code> brauchst du nur außerhalb dieses Repositorys." }
