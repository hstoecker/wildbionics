    insect_flight:
      title: "Eine schwebende Honigbiene: Ihre Flügel schwingen etwa 230-mal pro Sekunde vor und zurück, und ein Vorderkantenwirbel auf jedem Flügel erzeugt zusätzlichen Auftrieb"
      desc: "Schematische Seitenansicht einer Honigbiene, die in der Luft schwebt, erkennbar am gestreiften Hinterleib, dem behaarten Thorax, dem großen Komplexauge, den geknieten Antennen, Beinen mit Pollenhöschen und zwei Paar durchsichtigen Flügeln. Ein gepunkteter Bogen über der Biene zeigt die Bahn der Flügelspitze: Die Flügel schwingen etwa 230-mal pro Sekunde um rund 90 Grad vor und zurück und drehen sich an jedem Ende des Schlags um. Der Flügel am vorderen Ende des Schlags ist kräftig gezeichnet, der am hinteren Ende blass. Ein Lupenkreis zeigt den Querschnitt des Flügels, der sich unter steilem Winkel nach vorn bewegt: Auf der Oberseite, dicht hinter der Vorderkante, rollt sich die Luft zu einem spiralförmigen Vorderkantenwirbel auf, und ein großer Pfeil nach oben zeigt den Auftrieb."
