      desc: "Side view of a pistol shrimp: a smooth carapace hooding the eyes, a segmented abdomen with tail fan, walking legs, long antennae, a small pincer claw and a huge snapping claw. The movable finger of the snapping claw, the dactyl, carries a plunger. When the claw snaps shut, the plunger drives water out of a socket as a fast jet. A cavitation bubble forms in the jet and collapses, sending out a shock wave."
