      desc: "Schematische Seitenansicht einer Katze, die auf dem Rücken liegend fällt, in vier Momentaufnahmen, die mit der Zeit nach rechts unten wandern. 1: Die Katze liegt auf dem Rücken. 2: Mit angezogenen Vorderbeinen dreht sich die vordere Hälfte um, während sich die hintere Hälfte mit gestreckten Hinterbeinen nur wenig zurückdreht. 3: Mit angezogenen Hinterbeinen folgt die hintere Hälfte. 4: Beide Hälften sind aufgerichtet, die Beine strecken sich zum Boden. Der Gesamtdrehimpuls bleibt die ganze Zeit null."
