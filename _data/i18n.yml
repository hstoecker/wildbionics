    vdw:
      title: "Van der Waals attraction between two flat surfaces as a function of their distance"
      desc: "Log-log plot of the attractive van der Waals pressure P = A / (6 π D³) for a typical Hamaker constant A of 10⁻¹⁹ joules. At a contact distance of about 0.3 nanometres the pressure is around 200 megapascals; at 1 nanometre it is 37 times weaker, at 10 nanometres 37,000 times weaker. Only surfaces in intimate contact attract each other strongly."
