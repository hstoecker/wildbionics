        title: "Zeit"
        sub: "Evolution & Geologie"
        text: "Vom Urknall bis zu humanoiden Robotern – und weiter zur offenen Frage der Superintelligenz: Wann ist eine Lösung entstanden, und wie lange haben Natur oder Technik sie verfeinert?"
        examples: ["Kambrium", "Känozoikum", "KI-Zeitalter"]
      - key: space
        title: "Raum"
