    cat_lapping:
      title: "Wie eine Katze trinkt: Die Zunge zieht eine Wassersäule hoch, und das Maul schließt sich, bevor sie fällt"
      desc: "Schematische Seitenansicht einer trinkenden Katze in drei Momentaufnahmen über einer Wasseroberfläche. 1: Die Zungenspitze ist nach hinten gebogen und liegt auf der Oberfläche, ohne einzutauchen. 2: Die Zunge bewegt sich schnell nach oben und zieht eine Wassersäule hinter sich her; die Trägheit trägt das Wasser nach oben, die Schwerkraft zieht es nach unten. 3: Das Maul schließt sich und fängt die Spitze der Säule, der Rest fällt in die Schale zurück."
