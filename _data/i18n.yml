  hero:
    eyebrow: "Ein Open-Source-Kompendium"
    title_html: "Die <em>Physik</em> der Natur, erklärt."
    lede: "Wie sieht eine Fledermaus im Dunkeln? Warum blitzt es, wenn ein Krebs mit der Schere knallt? WildBionics verbindet Biologie mit Physik, Mathematik, Chemie, Informatik und Physical AI – anhand von Tieren, Pflanzen und unserem lebendigen Planeten – und zeigt, wie Ingenieure sich Lösungen von der Natur abschauen."
    cta_primary: "Die Linse ausprobieren"
    cta_secondary: "Auf GitHub mitmachen"
    fig_label: "Abb. 1"
    fig_caption: "Echoortung. Eine Fledermaus sendet einen frequenzmodulierten Ruf aus; die Verzögerung des Echos verrät, wie weit die Motte entfernt ist."
    svg_title: "Schema der Echoortung einer Fledermaus"
    svg_desc: "Eine Fledermaus sendet Schallwellen zu einer Motte. Echowellen laufen zurück. Die Echoverzögerung von 17,5 Millisekunden entspricht einer Entfernung von etwa 3 Metern. Ein Spektrogramm zeigt, wie der Ruf von 80 auf 40 Kilohertz abfällt."
    svg_call: "Ruf · FM 80→40 kHz"
    svg_echo: "Echo · Δt = 17,5 ms"
    svg_distance: "d = c·Δt / 2 ≈ 3,0 m"
    svg_moth: "Motte"
    svg_spectrogram: "Spektrogramm"
    disciplines_label: "Erklärt durch"
    disciplines: ["Biologie", "Physik", "Mathematik", "Chemie", "Informatik", "Physical AI"]
  lens:
    eyebrow: "Die Linse"
    title_html: "<span class=\"line\">Ein Phänomen.</span> <span class=\"line\">Vier Arten, es zu sehen.</span>"
    intro: "Jeder WildBionics-Artikel lässt sich durch verschiedene Linsen lesen. Wechsle zwischen ihnen und verfolge dieselbe Fledermausjagd mit den Augen eines Biologen, einer Physikerin, eines Mathematikers und einer Programmiererin."
    tabs_label: "Linse wählen"
    article_cta: "Zum ganzen Artikel über die Echoortung der Fledermäuse"
    biology:
      tab: "Biologie"
      kicker: "Sinnesökologie · Evolution"
      title: "Wettrüsten im Dunkeln"
      text: "Die Echoortung machte Fledermäuse zu gefürchteten Nachtjägern – und ihre Beute zu Zuhörern. Viele Nachtfalter haben Ohren entwickelt, die Fledermausrufe wahrnehmen und ein Ausweichmanöver auslösen. Manche Bärenspinner gehen noch weiter: <em>Bertholdia trigona</em> antwortet einer angreifenden Fledermaus mit eigenen Ultraschall-Klicks, die deren Sonar stören."
      source_html: "Corcoran, Barber &amp; Conner (2009), <cite>Science</cite> 325, 325–327. <a href=\"https://doi.org/10.1126/science.1174096\">doi:10.1126/science.1174096</a>"
      svg_title: "Fledermaus und Bärenspinner: Sonar und Sonarstörung"
      svg_desc: "Eine Fledermaus sendet Sonarrufe zu einem Bärenspinner. Der Falter fliegt eine Ausweichschleife und antwortet mit Ultraschall-Klicks, die das Sonar der Fledermaus stören."
      svg_bat: "Fledermaus: Sonarruf"
      svg_moth: "Falter: Ultraschall-Klicks"
      svg_path: "Ausweichflug"
    physics:
      formula_label: "Delta f ungefähr gleich 2 v f null durch c"
      tab: "Physik"
      kicker: "Akustik · Doppler-Effekt"
      title: "Geschwindigkeit hören"
      text: "Fliegt eine Fledermaus auf eine Motte zu, hört sie das Echo höher, als sie gerufen hat. Die Größe dieser Doppler-Verschiebung verrät ihr, wie schnell sie sich nähert. Hufeisennasen senken im Flug sogar ihre Ruffrequenz, damit das Echo immer in ihrem empfindlichsten Hörbereich landet."
      example_html: "Bei <var>v</var> = 5 m/s und <var>f</var><sub>0</sub> = 50 kHz kommt das Echo etwa 1,5 kHz höher zurück."
      svg_title: "Doppler-Effekt einer fliegenden Fledermaus"
      svg_desc: "Vor der fliegenden Fledermaus drängen sich die Wellenfronten, hinter ihr liegen sie weiter auseinander."
      svg_ahead: "Vorne: gestaucht · höheres f"
      svg_behind: "Hinten: gedehnt · tieferes f"
    math:
      formula_d_label: "d gleich c mal Delta t durch 2"
      formula_theta_label: "Theta gleich Arkussinus von c mal Delta tau durch b"
      tab: "Mathematik"
      kicker: "Geometrie · Trigonometrie"
      title: "Entfernung mit Zeit messen"
      text: "Schall legt in Luft rund 343 m/s zurück. Die halbe Laufzeit des Echos ergibt die Entfernung. Der winzige Laufzeitunterschied zwischen linkem und rechtem Ohr – der interaurale Laufzeitunterschied – liefert die Richtung – zwei Messungen, eine Position."
      example_html: "Ein Echo nach 17,5 ms bedeutet: Die Motte ist 3,0 m entfernt. <span class=\"legend\"><var>Δτ</var>: interauraler Laufzeitunterschied, <var>b</var>: Ohrabstand.</span>"
      svg_title: "Geometrie der Echo-Entfernungsmessung"
      svg_desc: "Ein rechtwinkliges Dreieck von der Fledermaus zur Motte mit Entfernung d und Winkel Theta, darunter eine Zeitachse mit dem Ruf und dem Echo 17,5 Millisekunden später."
      svg_call: "Ruf"
      svg_echo: "Echo"
      svg_dt: "Δt = 17,5 ms"
    physical-ai:
      tab: "Physical AI"
    cs:
      tab: "Informatik"
      kicker: "Signalverarbeitung · Sonar"
      title: "Vom Chirp zum Code"
      text: "Autonome Drohnen und Ultraschall-Parksensoren nutzen denselben Trick. Ein Optimalfilter (Matched Filter) schiebt den bekannten Chirp über die Aufnahme; das Maximum der Kreuzkorrelation markiert das Echo – robust selbst im Rauschen."
      code_label: "Python · NumPy"
