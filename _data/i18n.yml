      spatulae: "Spatulae"
      spatulae_size: "0.2–0.5 µm wide"
      vdw: "van der Waals attraction"
      note: "Schematic · not to scale"
    wetting:
      title: "Three ways a water drop can sit on a surface"
      desc: "Three panels side by side. Left: a drop on smooth lotus wax forms a contact angle of about 119 degrees and clings to the surface. Middle: on a rough surface in the Wenzel state, water fills the grooves between the bumps; the angle is larger, but the drop is pinned. Right: in the Cassie–Baxter state, the drop rests on the tips of the bumps with an air cushion underneath; it stays almost spherical, with a contact angle of more than 160 degrees, and rolls off."
      flat: "Smooth wax"
      wenzel: "Rough, soaked"
      cassie: "Rough, on air"
