    cat_box:
      title: "Schrödingers Katze: ein Gedankenexperiment in einer verschlossenen Stahlkammer"
      desc: "Schema von Schrödingers Gedankenexperiment aus dem Jahr 1935, kein echtes Experiment. Eine verschlossene Stahlkammer enthält eine winzige radioaktive Probe, ein Zählrohr, ein Relais mit einem Hämmerchen über einem Kölbchen mit Gift und eine Katze. Zerfällt ein Atom, löst das Zählrohr das Hämmerchen aus, das Kölbchen zerbricht und die Katze stirbt. Nach einer Stunde ist ein Zerfall genauso wahrscheinlich wie keiner. Wörtlich genommen beschreibt die Quantenmechanik die Katze dann als Überlagerung von lebendig und tot, hier als zwei durchscheinende Katzen übereinander gezeichnet: eine sitzt aufrecht, eine liegt auf der Seite."
