    cat_lapping:
      title: "How a cat laps: the tongue pulls up a column of water, and the jaws close before it falls"
      desc: "Schematic side view of a cat drinking, in three snapshots above a water surface. 1: the tip of the tongue is curled backwards and rests on the surface without dipping in. 2: the tongue moves up fast and pulls a column of water behind it; inertia carries the water upwards while gravity pulls it down. 3: the jaws close and catch the top of the column, the rest falls back into the bowl."
