    title: "Der Knallkrebs und die Physik der Kavitation"
    text: "Mit einem einzigen Zuschnappen seiner übergroßen Schere schießt ein nur wenige Zentimeter großer Krebs einen Wasserstrahl ab – so schnell, dass der Druck dahinter unter den Dampfdruck fällt. Eine Blase entsteht und kollabiert, und für einen winzigen Moment erreicht ihr Kern Tausende Kelvin und sendet einen Lichtblitz aus."
