    run_tumble:
      title: "Laufen und Taumeln: E. coli schwimmt gerade Strecken, taumelt und startet in eine neue Richtung – Läufe hin zu mehr Nahrung dauern länger"
      desc: "Schema eines Bakteriums E. coli in einem Nahrungsgefälle; nach rechts gibt es mehr Nahrung. Die stäbchenförmige Zelle schwimmt einen geraden Lauf, ihre schraubenförmigen Flagellen drehen sich dahinter gemeinsam als Bündel. Am Ende des Laufs taumelt sie: Ein Motor dreht um, und die Flagellen zeigen in verschiedene Richtungen. Dann schwimmt sie in eine neue Richtung. Läufe nach links, zu weniger Nahrung, sind kurz; Läufe nach rechts, zu mehr Nahrung, sind lang – die Bahn ist ein Zickzack, wandert aber nach rechts."
