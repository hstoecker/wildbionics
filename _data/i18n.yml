      cassie_angle: "θ > 160°"
      flat_drop: "drop clings"
      wenzel_drop: "drop is pinned"
      cassie_drop: "drop rolls off"
    lotus:
      title: "Sacred lotus leaf with water droplets, with a zoom into its water-repellent surface"
      desc: "Schematic of a round, wavy lotus leaf on a stem above a pond, next to a pink lotus flower. Water drops sit on the leaf as almost perfect spheres; one drop rolls across it, leaves a clean track behind and carries the dirt particles it has picked up. Three zoom circles lead from the drop into the surface: first a drop resting on the leaf with a contact angle of more than 160 degrees, then a row of papillae about 15 micrometres high with the drop resting only on their tips and air between them, and finally a single papilla covered with wax tubules 0.3 to 1 micrometre long."
      plant: "Sacred lotus"
