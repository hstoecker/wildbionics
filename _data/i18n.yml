    robin_compass:
      title: "Der Magnetkompass des Rotkehlchens: Es liest die Neigung der Feldlinien – nach der führenden Hypothese mit einem lichtgetriebenen Radikalpaar im Auge"
      desc: "Schema. Ein Rotkehlchen mit orangerotem Gesicht und orangeroter Brust sitzt auf einem Zweig. Die Feldlinien des Erdmagnetfelds laufen steil schräg nach unten in den Boden, unter einem Winkel zum Horizont. Ein Ausschnitt aus dem Auge des Vogels zeigt ein Radikalpaar: zwei Moleküle mit je einem ungepaarten Elektron, dessen Spin als Pfeil gezeichnet ist. Ob die beiden Spins gepaart bleiben, hängt vom Winkel zwischen Molekül und Feld ab – nach der führenden Hypothese gibt das dem Vogel ein Sehsignal für die Richtung des Feldes."
