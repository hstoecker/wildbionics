      desc: "Schematic side view of a walking person in shirt, trousers and shoes and, beside it, a generic humanoid robot with grey panels, joint discs and a dark visor, both in the same phase of a step: the stance leg stands straight under the hip, the other leg swings forward, the arms swing opposite to the legs. For both, the stance leg is drawn as the rod of an upside-down pendulum from the foot, the pivot on the ground, to a dot at the hip near the centre of mass. A dotted arc with an arrow shows the path of the hip during the step: it rises over the foot and falls again; faint rods mark where the leg points at the start and end of the step. Both arcs have the same shape – the robot walks by the same physics."
