  guide:
    nav: "Anleitung"
    url: "/de/mitmachen/"
    title: "Bei WildBionics mitmachen"
    description: "So trägst du Artikel, Korrekturen, Übersetzungen und Abbildungen zu WildBionics bei – mit Claude oder von Hand, geprüft vor der Veröffentlichung."
    eyebrow: "Open Source"
    intro: "WildBionics wächst mit allen, die neugierig sind. Du kannst Fehler melden, Phänomene vorschlagen, Artikel schreiben, übersetzen, Abbildungen zeichnen oder die Website verbessern – allein oder zusammen mit Claude. Jede Änderung wird automatisch geprüft und von einem Menschen freigegeben, bevor sie online geht."
    ways_title: "Drei Arten mitzuarbeiten"
    ways:
      - title: "Claude auf GitHub fragen"
        text: "Mitwirkende schreiben ein Issue oder einen Kommentar mit @claude – zum Beispiel „@claude entwirf einen Artikel darüber, wie Geckos an Wänden haften“. Claude recherchiert, schreibt mit den Skills des Projekts und öffnet einen Pull Request zur Prüfung."
      - title: "Mit Claude Code arbeiten"
        text: "Öffne das Repository in der Claude-Desktop-App, im Terminal oder auf claude.ai/code. Die WildBionics-Skills laden automatisch. Außerhalb des Repositorys installierst du sie aus unserem Plugin-Marketplace:"
      - title: "Von Hand arbeiten"
        text: "Forke das Repository, bearbeite Markdown- und YAML-Dateien, lass die Prüfungen laufen und öffne einen Pull Request. Die Regeln sind dieselben – sie stehen in CONTRIBUTING.md und in den Skills."
    steps_title: "Von der Idee zur Seite"
    steps:
      - "Issue öffnen: eine Artikelidee, eine Korrektur oder eine Übersetzung."
      - "Auf einem Branch mit dem passenden Skill arbeiten – Recherche, englischer Text, Abbildungen, deutsche Übersetzung, Wissensgraph."
      - "Prüfungen lokal laufen lassen, die eigene Arbeit prüfen, Pull Request öffnen."
      - "Automatische Prüfungen: Terminologie, Struktur, Skills, SEO und Links – dazu eine Vorschau mit Screenshots und ein Review durch Claude."
      - "Der Maintainer liest das Review, sieht sich die Vorschau an und gibt frei."
      - "Freigegebene Änderungen sind nach wenigen Minuten auf wildbionics.com online."
    live_note: "Nichts geht ohne die Freigabe eines Menschen online."
    rules_title: "Qualitätsregeln"
    rules:
      - "Jede Aussage hat eine überprüfbare Quelle, meist eine begutachtete Veröffentlichung mit DOI. Abgeleitete Zahlen werden nachgerechnet, Code wird ausgeführt."
      - "Hypothesen wie Superintelligenz werden als Szenarien dargestellt, nie als Tatsachen."
      - "Deutsche Texte verwenden die korrekten Fachbegriffe aus unserem Glossar."
      - "Abbildungen müssen erkennbar, konzeptionell klar, korrekt und ansprechend sein."
      - "Barrierefrei (WCAG 2.2 AA), funktioniert ohne JavaScript, keine neuen Abhängigkeiten."
    skills_title: "Die Skills – unser Regelwerk"
    skills_intro: "Skills sind Anleitungen, die Claude lädt, wenn eine Aufgabe sie braucht. Es sind dieselben Regeln, die auch menschliche Mitwirkende befolgen."
    skills:
      - { name: "wildbionics-contribute", text: "Orientierung, Ablauf und Einrichtung – hier anfangen" }
      - { name: "wildbionics-article", text: "Recherche, Quellen, Aufbau, Linsen, Such- und Antwortmaschinen" }
      - { name: "wildbionics-translate", text: "Englisch ⇄ Deutsch mit dem Projektglossar" }
      - { name: "wildbionics-figures", text: "konzeptionelle Abbildungen, die den Qualitätsmaßstab erfüllen" }
      - { name: "wildbionics-graph", text: "Ontologie und Wissensgraph" }
      - { name: "wildbionics-design", text: "UI/UX, Barrierefreiheit, Frontend-Regeln" }
      - { name: "wildbionics-review", text: "Pull Requests prüfen, mit einem Agenten zur Faktenprüfung" }
    together_title: "Gemeinsam arbeiten"
    together_text: "Familien, Schulklassen und Teams können gemeinsam an WildBionics arbeiten: Jede Person nutzt ihr eigenes GitHub-Konto und ihren eigenen Claude-Zugang, der Maintainer fügt sie als Mitwirkende hinzu, und alle tragen über Pull Requests bei. Der Prüfprozess hält die Qualität gleich – egal, wer oder welcher Agent eine Änderung geschrieben hat."
    cta_repo: "Zum Repository"
    cta_issue: "Ein Phänomen vorschlagen"
    cta_guide: "CONTRIBUTING.md lesen"
