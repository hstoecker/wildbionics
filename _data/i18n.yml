    walking:
      title: "Gehen als inverses Pendel: Ein Mensch und ein humanoider Roboter schwingen über ein steifes Standbein, und die Hüfte folgt demselben Bogen"
      desc: "Schematische Seitenansicht eines gehenden Menschen mit Hemd, Hose und Schuhen und daneben eines allgemein gestalteten humanoiden Roboters mit grauen Verkleidungen, Gelenkscheiben und dunklem Visier, beide in derselben Phase eines Schritts: Das Standbein steht gestreckt unter der Hüfte, das andere Bein schwingt nach vorn, die Arme schwingen gegengleich zu den Beinen. Bei beiden ist das Standbein als Stab eines umgedrehten Pendels eingezeichnet, vom Fuß, dem Drehpunkt am Boden, bis zu einem Punkt an der Hüfte nahe dem Schwerpunkt. Ein gepunkteter Bogen mit Pfeil zeigt die Bahn der Hüfte während des Schritts: Sie steigt über dem Fuß an und sinkt wieder; blasse Stäbe zeigen, wohin das Bein am Anfang und am Ende des Schritts zeigt. Beide Bögen haben dieselbe Form – der Roboter geht nach derselben Physik."
