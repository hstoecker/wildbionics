      title: "Run and tumble: E. coli swims in straight runs, tumbles and sets off in a new direction – runs towards more food last longer"
      desc: "Schematic of an E. coli bacterium in a food gradient; food increases to the right. The rod-shaped cell swims a straight run with its helical flagella together in a bundle behind it. At the end of the run it tumbles: a motor reverses and the flagella point in different directions. Then it swims off in a new direction. Runs to the left, towards less food, are short; runs to the right, towards more food, are long – so the path zigzags but drifts to the right."
