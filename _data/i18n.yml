          - { t: "Einladung anfragen", d: "Im <a href=\"https://github.com/hstoecker/wildbionics/issues/new\">Repository</a> ein Issue mit dem Titel „Collaborator request“ und deinem GitHub-Benutzernamen öffnen – oder den Maintainer direkt fragen." }
          - { t: "Einladung annehmen", d: "Über den Link in der E-Mail von GitHub oder unter <a href=\"https://github.com/hstoecker/wildbionics/invitations\">github.com/hstoecker/wildbionics/invitations</a>." }
          - { t: "Neues Issue öffnen", d: "<a href=\"https://github.com/hstoecker/wildbionics/issues/new/choose\">New issue</a> öffnen und <em lang=\"en\">Article idea</em> oder <em lang=\"en\">Correction</em> wählen." }
          - { t: "Anfrage schreiben – mit @claude am Anfang", d: "Sei konkret: welches Phänomen, für wen, welche Quellen du kennst. Beispiel:<pre class=\"guide-code\"><code>@claude Bitte recherchiere und entwirf einen WildBionics-Artikel darüber, wie Fledermäuse ihre Beute mit Echoortung finden. Folge den WildBionics-Skills, prüfe jede Quelle, schreibe zuerst Englisch, dann Deutsch.</code></pre>" }
          - { t: "Absenden und abwarten", d: "Auf <strong lang=\"en\">Submit new issue</strong> klicken. Claude antwortet in einem Kommentar und hakt beim Arbeiten eine Aufgabenliste ab – ein ganzer Artikel kann eine Weile dauern." }
          - { t: "Pull Request erstellen", d: "Ist Claude fertig, enthält sein Kommentar einen Link, um den Pull Request zu erstellen. Öffne ihn und klicke auf <strong lang=\"en\">Create pull request</strong>." }
          - { t: "Ergebnis ansehen", d: "Nach etwa 3 Minuten sind die Prüfungen fertig, und Claude hat ein Review geschrieben. Screenshots der neuen Seiten: <strong lang=\"en\">Checks → Build, check &amp; deploy → Artifacts → preview-pr-…</strong>." }
          - { t: "Änderungen wünschen", d: "Im Pull Request kommentieren und mit <strong>@claude</strong> beginnen – z. B. „@claude mach die Abbildung größer und ergänze eine FAQ zu …“. Claude pusht die Änderung." }
          - { t: "Freigabe und online", d: "Der Maintainer prüft und gibt frei. Wenige Minuten nach dem Merge ist dein Beitrag online." }
      - id: "by-hand"
        icon: "write"
        ribbon: "Absolute Experten"
        title: "Von Hand arbeiten"
        best: "Nur für absolute Experten, die der Maintainer persönlich kennt."
        badges: ["Kein Claude nötig", "git und Ruby", "Erfahrene Entwickler"]
        time: "5 Minuten für eine kleine Korrektur"
        who: "Absolute Experten, die der Maintainer persönlich kennt – git, Jekyll und die Projektregeln sind dir vertraut."
        needs: "Ein GitHub-Konto, git und für die lokale Vorschau und die Prüfungen Ruby 3.3 und Python 3.9 oder neuer."
        tip: "Sprich größere Änderungen vorher mit dem Maintainer ab. Pull Requests aus Forks bekommen kein automatisches Claude-Review, weil GitHub Forks keine Secrets gibt – der Maintainer prüft sie von Hand."
        steps:
          - { t: "Regeln lesen", d: "<a href=\"https://github.com/hstoecker/wildbionics/blob/main/CONTRIBUTING.md\">CONTRIBUTING.md</a> und die Skills in <a href=\"https://github.com/hstoecker/wildbionics/tree/main/plugins/wildbionics/skills\">plugins/wildbionics/skills</a> – einfaches Markdown, für Menschen genauso nützlich." }
          - { t: "Kleine Änderung: im Browser bearbeiten", d: "Datei auf GitHub öffnen (z. B. einen Artikel in <code>_articles/</code>), auf das Stift-Symbol klicken, bearbeiten, dann <strong lang=\"en\">Commit changes… → Create a new branch → Propose changes</strong>. GitHub legt bei Bedarf einen Fork an. Weiter mit Schritt 6." }
          - { t: "Größere Änderung: Fork und Branch", d: "Auf der Repository-Seite <strong lang=\"en\">Fork</strong> wählen (Mitwirkende können das überspringen), klonen und einen Branch anlegen:<pre class=\"guide-code\"><code>git clone https://github.com/&lt;dein-name&gt;/wildbionics.git\ncd wildbionics\ngit checkout -b article/bats</code></pre>" }
          - { t: "Dateien bearbeiten", d: "Neue Artikel als <code>_articles/&lt;slug&gt;.en.md</code> und <code>.de.md</code>, Texte der Oberfläche in <code>_data/i18n.yml</code>, deutsche Fachbegriffe in <code>_data/glossary.yml</code>." }
          - { t: "Prüfen und pushen", d: "Prüfungen und lokale Vorschau laufen lassen, dann committen und pushen:<pre class=\"guide-code\"><code>bundle install\npython3 -m pip install -r examples/requirements.txt -r .github/scripts/requirements.txt\nruby .github/scripts/check_terms.rb\nruby .github/scripts/check_content.rb\nruby .github/scripts/check_plugin.rb\npython3 .github/scripts/code_examples.py --check\nbundle exec jekyll build &amp;&amp; python3 .github/scripts/figures.py _site &amp;&amp; python3 .github/scripts/check_site.py _site\nbundle exec jekyll serve   # http://localhost:4000\ngit add -A &amp;&amp; git commit -m \"Add bat article\"\ngit push -u origin article/bats</code></pre>" }
          - { t: "Pull Request öffnen", d: "Gegen <code>hstoecker/wildbionics</code> · <code>main</code>; die Vorlage ausfüllen." }
          - { t: "Hinweise der Prüfungen beheben", d: "Eine fehlgeschlagene Prüfung nennt im Log Regel und Datei. Korrigieren und erneut pushen – der Pull Request aktualisiert sich selbst." }
          - { t: "Freigabe und online", d: "Der Maintainer prüft und gibt frei; nach dem Merge ist deine Änderung online." }
    flow:
      - { icon: "issue", t: "Issue", d: "Idee, Korrektur oder Übersetzung" }
      - { icon: "branch", t: "Branch", d: "Deine eigene Arbeitskopie" }
      - { icon: "check", t: "Prüfungen", d: "Gates und Selbst-Review" }
      - { icon: "pr", t: "Pull Request", d: "Automatische Prüfungen, Vorschau, Claude-Review" }
      - { icon: "eye", t: "Freigabe", d: "Der Maintainer prüft" }
      - { icon: "globe", t: "Online", d: "Nach wenigen Minuten live" }
    rules:
      - "Jede Aussage hat eine überprüfbare Quelle, meist eine begutachtete Veröffentlichung mit DOI. Abgeleitete Zahlen werden nachgerechnet, Code wird ausgeführt."
      - "Hypothesen wie Superintelligenz werden als Szenarien dargestellt, nie als Tatsachen."
      - "Deutsche Texte verwenden die korrekten Fachbegriffe aus unserem Glossar."
      - "Abbildungen müssen erkennbar, konzeptionell klar, korrekt und ansprechend sein."
      - "Barrierefrei (WCAG 2.2 AA), funktioniert ohne JavaScript, keine neuen Abhängigkeiten."
    skills:
      - { name: "wildbionics-contribute", text: "Orientierung, Ablauf und Einrichtung – hier anfangen" }
      - { name: "wildbionics-article", text: "Recherche, Quellen, Aufbau, Linsen, Such- und Antwortmaschinen" }
      - { name: "wildbionics-translate", text: "Englisch ⇄ Deutsch mit dem Projektglossar" }
      - { name: "wildbionics-figures", text: "konzeptionelle Abbildungen, die den Qualitätsmaßstab erfüllen" }
      - { name: "wildbionics-graph", text: "Ontologie und Wissensgraph" }
      - { name: "wildbionics-design", text: "UI/UX, Barrierefreiheit, Frontend-Regeln" }
      - { name: "wildbionics-review", text: "Pull Requests prüfen, mit einem Agenten zur Faktenprüfung" }
    terms:
      - { t: "GitHub", d: "Die Plattform, auf der alle Texte, Abbildungen und der Code von WildBionics liegen und besprochen werden." }
      - { t: "Repository", d: "Der Projektordner auf GitHub – alle Dateien samt ihrer kompletten Geschichte." }
      - { t: "Issue", d: "Ein Ticket für eine Idee, eine Frage oder einen Fehler. Der Startpunkt jedes Beitrags." }
      - { t: "Branch", d: "Eine eigene Arbeitskopie. Änderungen dort berühren die Live-Seite nicht." }
      - { t: "Pull Request", d: "Die Bitte, die Änderungen eines Branches zu übernehmen. Er wird vorher geprüft und begutachtet." }
      - { t: "Merge", d: "Das Übernehmen der Änderungen eines freigegebenen Pull Requests – wenige Minuten später sind sie online." }
      - { t: "Skill", d: "Eine Anleitung, die Claude für eine Aufgabe lädt. Unsere Skills enthalten die Regeln des Projekts." }
      - { t: "Cloud-Umgebung", d: "Die Einstellungen des Cloud-Rechners, auf dem eine Claude-Code-Sitzung läuft: welche Websites er erreichen darf, Umgebungsvariablen und ein Setup-Skript." }
  graph:
    nav: "Wissensgraph"
    title: "Der Wissensgraph"
    description: "Erkunde, wie WildBionics-Artikel Lebewesen, Lebensräume, physikalische Regeln und Wissenschaften verbinden – eine interaktive Karte aus offenen Daten."
    eyebrow: "Die Karte"
    intro: "Jeder Artikel ist ein Knoten. Er verbindet sich mit den Lebewesen oder Gedankenexperimenten, um die es geht, mit seinem Platz in Zeit und Raum, mit den physikalischen Regeln dahinter und mit den Wissenschaften, die er berührt. Je mehr Artikel entstehen, desto dichter wird das Netz."
    stats: "%A% Artikel · %T% Begriffe · %E% Verbindungen"
    legend: "Legende"
    article: "Artikel"
    being: "Lebewesen"
    thought_experiment: "Gedankenexperiment"
    lens: "Linse eines Artikels"
    concept_unused: "Begriff noch ohne Artikel"
    filter: "Dimensionen anzeigen"
    hint: "Fahre über einen Knoten, tippe ihn an oder fokussiere ihn, um seine Verbindungen zu sehen – erneut tippen löst ihn. Artikel öffnen sich per Klick oder Eingabetaste."
    node_name: "%NAME% (%TYPE%) – Verbindungen: %N%"
    node_name_dim: "%NAME% – Verbindungen: %N%"
    svg_label: "Interaktiver Wissensgraph von WildBionics"
    list_title: "Alle Verbindungen als Liste"
    no_article: "noch kein Artikel"
    data: "Graph als JSON herunterladen"
    data_ld: "als JSON-LD (Linked Data, schema.org)"
    data_note: "Offene Daten (CC BY-SA 4.0), bei jedem Build aus dem Front Matter der Artikel erzeugt."
    url: "/de/wissensgraph/"
    explain:
      eyebrow: "Warum ein Graph?"
      title: "Was ist ein Wissensgraph?"
      intro: "Wissen als Netz statt als Liste: Dinge sind <strong>Knoten</strong>, ihre Beziehungen sind <strong>Kanten</strong>. Ein Graph beantwortet nicht nur „Was ist das?“, sondern auch „Womit hängt es zusammen – und wie?“"
      anatomy:
        title: "Knoten und Kanten"
        text: "Jeder Artikel ist ein Knoten. Seine Kanten sagen, wovon er handelt und wohin er gehört – hier der Gecko-Artikel, genau so, wie ihn der Graph oben speichert."
        svg_title: "Ein Artikel und seine Kanten"
        svg_desc: "Der Gecko-Artikel in der Mitte ist mit vier Knoten verbunden: Er handelt vom Tokeh (ein Lebewesen), spielt im Mikrokosmos (Raum), folgt den Regeln der Mechanik (Physik) und blickt durch die Linse der Mathematik (eine Disziplin)."
        about: "handelt von"
        space: "spielt im"
        rule: "folgt"
        lens: "Linse"
        discipline: "Disziplin"
      dims:
        title: "Vier Dimensionen als Koordinaten"
        text: "Jeder Artikel wird in allen vier zugleich verortet – das macht Krebs, Gecko und Roboter vergleichbar."
        time: "Wann?"
        space: "Wo?"
        physics: "Welche Gesetze?"
        adjacent_sciences: "Welche Disziplinen?"
      lenses:
        title: "Linsen als Brücken"
        text: "Eine Linse ist ein Blickwinkel auf dasselbe Phänomen. Im Graphen ist jede Linse eine Kante vom Artikel zu seiner Disziplin."
      shared:
        title: "Gemeinsame Begriffe verbinden"
        text: "Artikel, die nichts miteinander zu tun zu haben scheinen, treffen sich an gemeinsamen Knoten. Mit jedem neuen Artikel wird das Netz dichter, und das nächste lesenswerte Thema ist leichter zu finden. Jeder Artikel beschreibt seine Themen außerdem als strukturierte Daten (JSON-LD), damit Suchmaschinen und KI-Assistenten ihn verstehen."
        svg_title: "Zwei Artikel, zwei gemeinsame Knoten"
        svg_desc: "Der Knallkrebs-Artikel und der Gecko-Artikel sind beide mit dem Labor und der Bionik verbunden – so verknüpft der Graph sie, obwohl der eine von Wasser und der andere von Wänden handelt."
      ai:
        title: "Warum auch KI ihn braucht"
        text: "Sprachmodelle sind stark in Sprache, aber schwach bei Fakten, die sie nicht nachschlagen können: Sie erfinden mitunter plausible Antworten und müssen lange Texte lesen, um eine einzige Beziehung zu finden. Ein Wissensgraph liefert ihnen ausdrückliche, belegte Verbindungen – deshalb veröffentlicht WildBionics seinen Graphen als offene Daten, versieht jede Seite mit JSON-LD und bietet eine llms.txt an."
        example: "Beispiel"
        question: "In welchem Artikel treffen Mechanik und Physical AI aufeinander?"
        without_title: "Ohne Graph"
        without_text: "Jeden Artikel lesen – bisher %N%"
        with_title: "Mit dem Graphen"
        with_text: "Zwei Kanten folgen"
        tokens: "Tokens"
        answer: "Antwort"
        note: "Die Artikelseite wächst mit jedem neuen Artikel; die Antwort aus dem Graphen bleibt bei zwei Kanten. Geschätzt aus den aktuellen Daten dieser Website mit etwa 4 Zeichen pro Token – eine Faustregel für englischen Text; die genaue Zahl hängt vom Modell und von der Sprache ab."
        findings:
          - title: "Genauere Antworten"
            text: "In einem Benchmark mit Geschäftsfragen beantwortete GPT-4 direkt auf einer SQL-Datenbank 16 % richtig – und 54 %, wenn die Fragen über einen Wissensgraphen derselben Daten gestellt wurden."
            src: [0]
          - title: "Bessere Überblicke"
            text: "Bei Fragen zu einer ganzen Sammlung, etwa „Was sind die Hauptthemen?“, lieferte ein Graph-Index deutlich umfassendere und vielfältigere Antworten als die übliche Textsuche (RAG)."
            src: [1]
          - title: "Nachvollziehbares Schließen, geringere Kosten"
            text: "Ein Modell, das einen Wissensgraphen Schritt für Schritt erkundet, kann seinen Denkweg offenlegen; bei manchen Aufgaben übertraf ein kleines Modell mit Graph sogar GPT-4."
            src: [2]
          - title: "Weniger Halluzinationen"
            text: "Antworten in einem Graphen aus Fakten zu verankern, ist ein vielversprechender Weg gegen plausible, aber falsche Antworten – ein Feld, an dem noch intensiv geforscht wird."
            src: [3, 4]
          - title: "Keine Verwechslungen"
            text: "WildBionics verknüpft seine Themen mit Wikidata: „Gecko“ bedeutet dann die Echse (Q1008888), nicht die gleichnamige Browser-Engine."
        sources_title: "Quellen"
      actions:
        title: "Was du damit machen kannst"
        explore_title: "Erkunden"
        explore_text: "Fahre über einen Knoten oder tippe ihn an, um seine Nachbarn zu sehen, und filtere die Dimensionen."
        explore_link: "Zum Graphen"
        gaps_title: "Lücken finden"
        gaps_text: "Graue Begriffe haben noch keinen Artikel – eine Einladung, einen zu schreiben."
        gaps_link: "Schreib den fehlenden Artikel"
        reuse_title: "Daten weiterverwenden"
        reuse_text: "Der Graph steht als offene Daten unter CC BY-SA 4.0 bereit – baue eigene Auswertungen oder Visualisierungen."
        reuse_link: "graph.json herunterladen"
