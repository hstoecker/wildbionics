      title: "How a falling cat turns over: front half first, then the rear half"
      desc: "Schematic side view of a cat falling upside down, in four snapshots that move down and to the right in time. 1: the cat is upside down. 2: with its front legs tucked in, the front half turns over, while the rear half with stretched hind legs turns back only a little. 3: with its hind legs tucked in, the rear half follows. 4: both halves are upright and the legs stretch towards the ground. The total angular momentum stays zero throughout."
      s1: "upside down"
      s2: "front turns"
      s3: "rear follows"
      s4: "feet down"
