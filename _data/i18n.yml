      - { title: "Parents", text: "Your child asked a “why” question you couldn’t answer? Suggest it, and explore the answer together." }
      - { title: "Science fans and the curious", text: "You love finding out how the world works? Suggest what amazes you, discuss the science behind it – or help us explain it." }
    contact_title: "Talk to us"
    contact_intro: "Write in English or German – whichever you prefer."
    contact_discussions_title: "Discussions"
    contact_discussions_text: "Questions, topic ideas and introductions – open to everyone, and the answers help the next person too."
    contact_discussions_cta: "Open Discussions"
    contact_email_title: "E-mail"
    contact_email_text: "No GitHub account? Write to us."
    contact_issue_title: "Found a mistake?"
    contact_issue_text: "Report a clear error or a broken page as an issue – that gets it fixed fastest."
    contact_issue_cta: "Report a correction"
    cta_guide: "Read CONTRIBUTING.md"
    ways:
      - id: "claude-code"
        icon: "terminal"
        ribbon: "Recommended"
        title: "Work with Claude Code"
        best: "The recommended way: Claude researches, writes and checks – you steer every step."
        badges: ["Claude Pro or Max", "Browser, app or terminal", "Full control"]
        time: "about 20 minutes to set up (once)"
        who: "Everyone with their own Claude plan – the recommended way to contribute."
        needs: "A GitHub account with an invitation to the repository and Claude Pro, Max, Team or Enterprise."
        tip: "On Windows use claude.ai/code: the skills are linked with symlinks, which Windows sometimes checks out incorrectly."
        steps:
          - { t: "Create a GitHub account and get invited", d: "Free at <a href=\"https://github.com/signup\">github.com/signup</a>. Then open an issue titled “Collaborator request” with your GitHub username in the <a href=\"https://github.com/hstoecker/wildbionics/issues/new\">repository</a> – or ask the maintainer directly – and accept the invitation via the e-mail from GitHub or at <a href=\"https://github.com/hstoecker/wildbionics/invitations\">github.com/hstoecker/wildbionics/invitations</a>." }
          - { t: "Sign in to Claude and connect GitHub", d: "Open <a href=\"https://claude.ai/code\">claude.ai/code</a>, sign in with your Claude plan and <strong>connect GitHub</strong> when asked. Accept the invitation first: until then <code>hstoecker/wildbionics</code> does not appear in the repository list. If it is still missing, reconnect GitHub at <a href=\"https://claude.ai/connect-github\">claude.ai/connect-github</a>." }
          - { t: "Create the WildBionics cloud environment (once)", d: "Every session runs on a fresh cloud machine; its <em>environment</em> decides which websites it may reach and what is installed. Environment selector next to the message box → <strong>Add cloud environment</strong> (to change an existing one: the environment menu in the session’s title bar → <strong>Edit</strong>). Fill in four fields:<dl class=\"guide-fields\"><div><dt>Name</dt><dd><code>WildBionics</code></dd></div><div><dt>Network access</dt><dd><strong>Custom</strong>, tick <em>Also include default list of common package managers</em> (RubyGems, for Jekyll) and allow these domains – without them Claude cannot verify sources (Crossref, DOI, PubMed, Semantic Scholar, Wikidata, Wikipedia):<pre class=\"guide-code\"><code>api.crossref.org\ndoi.org\neutils.ncbi.nlm.nih.gov\npubmed.ncbi.nlm.nih.gov\nwww.ncbi.nlm.nih.gov\napi.semanticscholar.org\nwww.wikidata.org\n*.wikipedia.org</code></pre></dd></div><div><dt>Environment variables</dt><dd><pre class=\"guide-code\"><code>LANG=C.UTF-8</code></pre>The cloud machine has no UTF-8 locale by default – without this line Jekyll and the checks crash at the first umlaut.</dd></div><div><dt>Setup script</dt><dd><pre class=\"guide-code\"><code>#!/bin/bash\nset -e\ngem install github-pages -v 232 --no-document\nln -sf \"$(ruby -e 'print Gem.bindir')/jekyll\" /usr/local/bin/jekyll\npython3 -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 fonttools==4.54.1 brotli==1.1.0</code></pre>Installs Jekyll in exactly the versions GitHub Pages uses. The <code>ln</code> line puts <code>jekyll</code> on the path – the cloud machine installs gem programs in a folder the shell does not search. The last line installs the Python libraries the code examples need, in the versions CI uses.</dd></div></dl>Then select <strong>Create environment</strong>. Screenshots need nothing extra: Chromium is preinstalled." }
          - { t: "Start a session", d: "Use the button below – repository and environment are preselected. Or choose <code>hstoecker/wildbionics</code> (branch <code>main</code>) and the <em>WildBionics</em> environment yourself.", cta: true }
          - { t: "Check the setup", d: "Send this as your first message:<pre class=\"guide-code\"><code>Run all local checks from CLAUDE.md and check that api.crossref.org is reachable.</code></pre>All five checks should report 0 errors. If not, see “If something doesn’t work” below." }
          - { t: "Describe your task", d: "For example:<pre class=\"guide-code\"><code>Write a new WildBionics article about how bats find their prey with echolocation. Start with the wildbionics-contribute skill and follow the article, figures, translate and graph skills.</code></pre>" }
          - { t: "Work together with Claude", d: "Answer its questions, ask to see the figures and pages as screenshots, and finish with: “Run all gates and review your work with wildbionics-review.”" }
          - { t: "Review the changes", d: "Open the diff via the <strong>+/−</strong> indicator. Comment on single lines if something should change." }
          - { t: "Create the pull request", d: "Select <strong>Create PR</strong> at the top of the diff view. After about 3 minutes the checks are done and Claude has posted a review; screenshots of the new pages are under <strong>Checks → Build, check &amp; deploy → Artifacts → preview-pr-…</strong>. Ask Claude in the session to fix any findings – it pushes to the same pull request. The maintainer approves; a few minutes after the merge your contribution is online." }
          - { t: "If something doesn’t work", d: "<dl class=\"guide-fields guide-fields--fix\"><div><dt>“invalid byte sequence in US-ASCII”</dt><dd>The environment variable <code>LANG=C.UTF-8</code> is missing.</dd></div><div><dt>“bundler: command not found: jekyll”</dt><dd>The setup script is missing or failed – check it in the environment settings.</dd></div><div><dt>Crossref, DOI or PubMed blocked (403, “host not allowed”)</dt><dd>Network access is not <strong>Custom</strong>, or the domain is missing from the list.</dd></div><div><dt>Repository missing from the list, push refused</dt><dd>Accept the invitation, then reconnect GitHub.</dd></div><div><dt>Environment changed, nothing happens</dt><dd>Settings only apply to new sessions – start a new one.</dd></div></dl>Still stuck? Open an issue with the error message." }
          - { t: "Optional: on your own computer", d: "Clone the repository and start Claude Code in it – the skills load automatically:<pre class=\"guide-code\"><code>git clone https://github.com/hstoecker/wildbionics.git\ncd wildbionics\nclaude</code></pre>The plugin commands <code>/plugin marketplace add hstoecker/wildbionics</code> and <code>/plugin install wildbionics@wildbionics</code> are only needed outside this repository." }
      - id: "github"
        icon: "github"
        ribbon: "Friends & Family"
        title: "Ask Claude on GitHub"
        best: "Nothing to install – only for friends and family of the maintainer."
        badges: ["No installation", "No Claude plan needed", "Browser only"]
        time: "about 10 minutes to set up"
        who: "Friends and family only: Claude runs on the maintainer’s account, so every request uses the maintainer’s Claude tokens."
        needs: "A free GitHub account and an invitation to the repository."
        tip: "One topic per issue, and as precise as possible – phenomenon, audience, sources you know. That gives better results and saves the maintainer’s tokens."
        steps:
          - { t: "Create a GitHub account", d: "Free at <a href=\"https://github.com/signup\">github.com/signup</a>. GitHub is where the whole project lives." }
          - { t: "Ask for an invitation", d: "Open an issue titled “Collaborator request” with your GitHub username in the <a href=\"https://github.com/hstoecker/wildbionics/issues/new\">repository</a> – or ask the maintainer directly." }
          - { t: "Accept the invitation", d: "Use the link in the e-mail from GitHub, or open <a href=\"https://github.com/hstoecker/wildbionics/invitations\">github.com/hstoecker/wildbionics/invitations</a>." }
          - { t: "Open a new issue", d: "Go to <a href=\"https://github.com/hstoecker/wildbionics/issues/new/choose\">New issue</a> and choose <em>Article idea</em> or <em>Correction</em>." }
          - { t: "Write your request – starting with @claude", d: "Be specific: which phenomenon, for whom, which sources you know. Example:<pre class=\"guide-code\"><code>@claude Please research and draft a WildBionics article about how bats find their prey with echolocation. Follow the WildBionics skills, verify every source, write English first, then German.</code></pre>" }
          - { t: "Submit and wait", d: "Select <strong>Submit new issue</strong>. Claude replies in a comment and ticks off a task list while it works – a full article can take a while." }
          - { t: "Create the pull request", d: "When Claude is done, its comment contains a link to create the pull request. Open it and select <strong>Create pull request</strong>." }
          - { t: "Check the result", d: "After about 3 minutes the checks are done and Claude has posted a review. Screenshots of the new pages: <strong>Checks → Build, check &amp; deploy → Artifacts → preview-pr-…</strong>." }
          - { t: "Ask for changes", d: "Comment in the pull request and start with <strong>@claude</strong> – e.g. “@claude make the figure larger and add a FAQ entry about …”. Claude pushes the change." }
          - { t: "Approval and go-live", d: "The maintainer reviews and approves. A few minutes after the merge your contribution is online." }
      - id: "by-hand"
        icon: "write"
        ribbon: "Experts only"
        title: "Work by hand"
        best: "Only for absolute experts the maintainer knows personally."
        badges: ["No Claude needed", "git and Ruby", "Experienced developers"]
        time: "5 minutes for a small fix"
        who: "Absolute experts the maintainer knows personally – git, Jekyll and the project rules are second nature to you."
        needs: "A GitHub account, git and, for the local preview and checks, Ruby 3.3 and Python 3.9 or newer."
        tip: "Talk to the maintainer before larger changes. Pull requests from forks get no automatic Claude review, because GitHub withholds secrets from forks – the maintainer reviews them by hand."
        steps:
          - { t: "Read the rules", d: "<a href=\"https://github.com/hstoecker/wildbionics/blob/main/CONTRIBUTING.md\">CONTRIBUTING.md</a> and the skills in <a href=\"https://github.com/hstoecker/wildbionics/tree/main/plugins/wildbionics/skills\">plugins/wildbionics/skills</a> – plain Markdown, just as useful for people." }
          - { t: "Small change: edit in the browser", d: "Open the file on GitHub (e.g. an article in <code>_articles/</code>), select the pencil icon, edit, then <strong>Commit changes… → Create a new branch → Propose changes</strong>. GitHub creates a fork if needed. Continue with step 6." }
          - { t: "Larger change: fork and branch", d: "Select <strong>Fork</strong> on the repository page (collaborators can skip this), clone it and create a branch:<pre class=\"guide-code\"><code>git clone https://github.com/&lt;your-name&gt;/wildbionics.git\ncd wildbionics\ngit checkout -b article/bats</code></pre>" }
          - { t: "Edit the files", d: "New articles as <code>_articles/&lt;slug&gt;.en.md</code> and <code>.de.md</code>, texts of the interface in <code>_data/i18n.yml</code>, German terms in <code>_data/glossary.yml</code>." }
          - { t: "Check and push", d: "Run the checks and the local preview, then commit and push:<pre class=\"guide-code\"><code>bundle install\npython3 -m pip install -r examples/requirements.txt -r .github/scripts/requirements.txt\nruby .github/scripts/check_terms.rb\nruby .github/scripts/check_content.rb\nruby .github/scripts/check_plugin.rb\npython3 .github/scripts/code_examples.py --check\nbundle exec jekyll build &amp;&amp; python3 .github/scripts/figures.py _site &amp;&amp; python3 .github/scripts/check_site.py _site\nbundle exec jekyll serve   # http://localhost:4000\ngit add -A &amp;&amp; git commit -m \"Add bat article\"\ngit push -u origin article/bats</code></pre>" }
          - { t: "Open a pull request", d: "Against <code>hstoecker/wildbionics</code> · <code>main</code>; fill in the template." }
          - { t: "Fix what the checks report", d: "A failing check names the rule and the file in its log. Fix it and push again – the pull request updates itself." }
          - { t: "Approval and go-live", d: "The maintainer reviews and approves; after the merge your change is online." }
    flow:
      - { icon: "issue", t: "Issue", d: "Idea, correction or translation" }
      - { icon: "branch", t: "Branch", d: "Your own working copy" }
      - { icon: "check", t: "Checks", d: "Gates and self-review" }
      - { icon: "pr", t: "Pull request", d: "Automatic checks, preview, Claude review" }
      - { icon: "eye", t: "Approval", d: "The maintainer reviews" }
      - { icon: "globe", t: "Live", d: "Online within minutes" }
    rules:
      - "Every fact has a verifiable source, usually a peer-reviewed paper with DOI. Derived numbers are recalculated, code is run."
      - "Hypotheses such as superintelligence are presented as scenarios, never as facts."
      - "German texts use the correct technical terms from our glossary."
      - "Figures must be recognisable, conceptually clear, correct and attractive."
      - "Accessible (WCAG 2.2 AA), works without JavaScript, no new dependencies."
    skills:
      - { name: "wildbionics-contribute", text: "orientation, workflow and setup – start here" }
      - { name: "wildbionics-article", text: "research, sources, structure, lenses, search and answer engines" }
      - { name: "wildbionics-translate", text: "English ⇄ German with the project glossary" }
      - { name: "wildbionics-figures", text: "conceptual figures that pass the quality bar" }
      - { name: "wildbionics-graph", text: "ontology and knowledge graph" }
      - { name: "wildbionics-design", text: "UI/UX, accessibility, front-end rules" }
      - { name: "wildbionics-review", text: "reviewing pull requests, with a fact-checking agent" }
    terms:
      - { t: "GitHub", d: "The platform where all texts, figures and code of WildBionics are stored and discussed." }
      - { t: "Repository", d: "The project folder on GitHub – all files plus their complete history." }
      - { t: "Issue", d: "A ticket for an idea, a question or an error. The starting point of every contribution." }
      - { t: "Branch", d: "A separate working copy. Changes there don’t touch the live site." }
      - { t: "Pull request", d: "A request to take over the changes of a branch. It is checked and reviewed first." }
      - { t: "Merge", d: "Taking over the changes of an approved pull request – a few minutes later they are live." }
      - { t: "Skill", d: "Instructions Claude loads for a task. Our skills contain the project’s rules." }
      - { t: "Cloud environment", d: "The settings of the cloud machine a Claude Code session runs on: which websites it may reach, environment variables and a setup script." }
  graph:
    nav: "Graph"
    title: "The knowledge graph"
    description: "Explore how WildBionics articles connect organisms, habitats, physical rules and sciences – an interactive map built from open data."
    eyebrow: "The map"
    intro: "Every article is a node. It links to the organisms or thought experiments it is about, to its place in time and space, to the physical rules behind it and to the sciences it touches. The more articles grow, the denser the web becomes."
    stats: "%A% articles · %T% concepts · %E% connections"
    legend: "Legend"
    article: "Article"
    being: "Organism"
    thought_experiment: "Thought experiment"
    lens: "Lens of an article"
    concept_unused: "Concept without an article yet"
    filter: "Show dimensions"
    hint: "Hover over, tap or focus a node to see its connections – tap again to let go. Articles open on click or Enter."
    node_name: "%NAME% (%TYPE%) – connections: %N%"
    node_name_dim: "%NAME% – connections: %N%"
    svg_label: "Interactive knowledge graph of WildBionics"
    list_title: "All connections as a list"
    no_article: "no article yet"
    data: "Download the graph as JSON"
    data_ld: "as JSON-LD (linked data, schema.org)"
    data_note: "Open data (CC BY-SA 4.0), generated from the articles' front matter at every build."
    url: "/graph/"
    explain:
      eyebrow: "Why a graph?"
      title: "What is a knowledge graph?"
      intro: "Knowledge as a network instead of a list: things are <strong>nodes</strong>, their relationships are <strong>edges</strong>. A graph answers not only “what is this?” but also “what is it connected to – and how?”"
      anatomy:
        title: "Nodes and edges"
        text: "Every article is a node. Its edges say what it is about and where it belongs – here the gecko article, exactly as the graph above stores it."
        svg_title: "One article and its edges"
        svg_desc: "The gecko article in the middle is connected to four nodes: it is about the tokay gecko (an organism), it is set in the microcosm (space), it follows the rules of mechanics (physics) and it looks through the lens of mathematics (a discipline)."
        about: "is about"
        space: "is set in"
        rule: "follows"
        lens: "lens"
        discipline: "Discipline"
      dims:
        title: "Four dimensions as coordinates"
        text: "Every article is placed in all four at once – that is what makes a shrimp, a gecko and a robot comparable."
        time: "When?"
        space: "Where?"
        physics: "Which laws?"
        adjacent_sciences: "Which disciplines?"
      lenses:
        title: "Lenses as bridges"
        text: "A lens is one way of looking at the same phenomenon. In the graph, each lens is an edge from the article to its discipline."
      shared:
        title: "Shared concepts connect"
        text: "Articles that seem unrelated meet at shared nodes. With every new article the web gets denser, and the next thing worth reading gets easier to find. Each article also describes its subjects as structured data (JSON-LD), so that search engines and AI assistants understand it."
        svg_title: "Two articles, two shared nodes"
        svg_desc: "The pistol shrimp article and the gecko article are both linked to the laboratory and to bionics – so the graph connects them, although one is about water and the other about walls."
      ai:
        title: "Why AI needs it, too"
        text: "Language models are strong at language but weak at facts they cannot look up: they may invent plausible answers, and they have to read long texts to find a single relationship. A knowledge graph hands them explicit, sourced connections – that is why WildBionics publishes its graph as open data, adds JSON-LD to every page and offers an llms.txt."
        example: "Example"
        question: "In which article do mechanics and Physical AI meet?"
        without_title: "Without a graph"
        without_text: "Read every article – %N% so far"
        with_title: "With the graph"
        with_text: "Follow two edges"
        tokens: "tokens"
        answer: "Answer"
        note: "The article side grows with every new article; the answer from the graph stays two edges. Estimated from this site’s current data at about 4 characters per token – a rule of thumb for English text; the exact count depends on the model and the language."
        findings:
          - title: "More accurate answers"
            text: "In a benchmark of business questions, GPT-4 answered 16% correctly on a raw SQL database – and 54% when the questions were posed over a knowledge graph of the same data."
            src: [0]
          - title: "Better overviews"
            text: "For questions about a whole collection, such as “what are the main themes?”, a graph index gave substantially more comprehensive and diverse answers than conventional retrieval (RAG)."
            src: [1]
          - title: "Traceable reasoning, lower cost"
            text: "A model that explores a knowledge graph step by step can show its reasoning path; in some tasks a small model with a graph outperformed GPT-4."
            src: [2]
          - title: "Fewer hallucinations"
            text: "Grounding answers in a graph of facts is a promising way to reduce plausible but false answers – still an active field of research."
            src: [3, 4]
          - title: "No mix-ups"
            text: "WildBionics links its topics to Wikidata: “gecko” then means the lizard (Q1008888), not the browser engine of the same name."
        sources_title: "Sources"
      actions:
        title: "What you can do"
        explore_title: "Explore"
        explore_text: "Hover over or tap a node to see its neighbours, and filter the dimensions."
        explore_link: "To the graph"
        gaps_title: "Find gaps"
        gaps_text: "Grey concepts have no article yet – an invitation to write one."
        gaps_link: "Write the missing article"
        reuse_title: "Reuse the data"
        reuse_text: "The graph is open data under CC BY-SA 4.0 – build your own analyses or visualisations."
        reuse_link: "Download graph.json"
  not_found:
    title: "Page not found"
    text: "This page has gone extinct – or never evolved. Try the home page or the list of articles."
    home: "Back to the home page"
