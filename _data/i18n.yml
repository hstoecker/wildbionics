    cat_box:
      title: "Schrödinger's cat: a thought experiment in a sealed steel chamber"
      desc: "Schematic of Schrödinger's 1935 thought experiment, not a real experiment. A sealed steel chamber holds a tiny radioactive sample, a Geiger counter tube, a relay with a hammer above a flask of poison, and a cat. If an atom decays, the counter triggers the hammer, the flask breaks and the cat dies. After one hour, a decay is exactly as likely as none. Taken literally, quantum mechanics then describes the cat as a superposition of alive and dead, drawn here as two overlapping translucent cats: one sitting upright, one lying on its side."
      sample: "radioactive sample"
