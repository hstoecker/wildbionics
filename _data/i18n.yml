      desc: "Schematic timeline from 4.5 billion years ago to today. Top: the Sun's brightness grows from about 74 percent of today's value 4 billion years ago to 100 percent. Middle: oxygen in the air, on a schematic scale – practically none until the Great Oxidation Event 2.4 to 2.3 billion years ago, low but present afterwards, near today's level only in the last few hundred million years. Bottom: first life at least 3.5 to 3.8 billion years ago, cyanobacteria probably 3.2 to 2.7 billion years ago, the rise of oxygen, and the Cambrian explosion of animals about 540 million years ago."
