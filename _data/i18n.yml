  hero:
    eyebrow: "An open-source compendium"
    title_html: "Nature’s <em>physics</em>, explained."
    lede: "How does a bat see in the dark? Why does a shrimp’s snap flash with light? WildBionics connects biology with physics, mathematics, chemistry, computer science and Physical AI – through animals, plants and the living planet – and shows how engineers borrow nature’s solutions."
    cta_primary: "See the lens in action"
    cta_secondary: "Contribute on GitHub"
    fig_label: "Fig. 1"
    fig_caption: "Echolocation. A bat sends out a frequency-modulated call; the delay of the echo reveals how far away the moth is."
    svg_title: "Diagram of bat echolocation"
    svg_desc: "A bat emits sound waves towards a moth. Echo waves travel back. The echo delay of 17.5 milliseconds corresponds to a distance of about 3 metres. An inset spectrogram shows the call sweeping down from 80 to 40 kilohertz."
    svg_call: "Call · FM 80→40 kHz"
    svg_echo: "Echo · Δt = 17.5 ms"
    svg_distance: "d = c·Δt / 2 ≈ 3.0 m"
    svg_moth: "Moth"
    svg_spectrogram: "Spectrogram"
    disciplines_label: "Explained through"
    disciplines: ["Biology", "Physics", "Mathematics", "Chemistry", "Computer science", "Physical AI"]
  lens:
    eyebrow: "The lens"
    title_html: "<span class=\"line\">One phenomenon.</span> <span class=\"line\">Four ways of seeing it.</span>"
    intro: "Every WildBionics article can be read through different lenses. Switch between them to follow the same bat hunt as a biologist, a physicist, a mathematician and a programmer would."
    tabs_label: "Choose a lens"
    biology:
      tab: "Biology"
      kicker: "Sensory ecology · Evolution"
      title: "An arms race in the dark"
      text: "Echolocation made bats formidable night hunters – and turned their prey into listeners. Many moths have evolved ears that pick up bat calls and trigger evasive flight. Some tiger moths go one step further: <em>Bertholdia trigona</em> answers an attacking bat with ultrasonic clicks of its own that jam the bat’s sonar."
      source_html: "Corcoran, Barber &amp; Conner (2009), <cite>Science</cite> 325, 325–327. <a href=\"https://doi.org/10.1126/science.1174096\">doi:10.1126/science.1174096</a>"
      svg_title: "Bat and tiger moth: sonar and sonar jamming"
      svg_desc: "A bat sends sonar calls towards a tiger moth. The moth flies an evasive loop and answers with ultrasonic clicks that jam the bat's sonar."
      svg_bat: "Bat: sonar call"
      svg_moth: "Moth: ultrasonic clicks"
      svg_path: "evasive flight"
    physics:
      tab: "Physics"
      kicker: "Acoustics · Doppler effect"
      title: "Hearing speed"
      text: "A bat flying towards a moth hears the echo at a higher pitch than the call it sent. The size of this Doppler shift tells it how fast it is closing in. Horseshoe bats even lower their call in flight, so that the echo always lands in their most sensitive band of hearing."
      example_html: "At <var>v</var> = 5 m/s and <var>f</var><sub>0</sub> = 50 kHz, the echo returns about 1.5 kHz higher."
      svg_title: "Doppler effect of a flying bat"
      svg_desc: "Wavefronts bunch up ahead of the moving bat and spread out behind it."
      svg_ahead: "Ahead: compressed · higher f"
      svg_behind: "Behind: stretched · lower f"
    math:
      tab: "Mathematics"
      kicker: "Geometry · Trigonometry"
      title: "Measuring distance with time"
      text: "Sound travels at about 343 m/s in air. Halve the round-trip time of the echo and you have the distance. The tiny difference in arrival time between the left and the right ear adds the direction – two measurements, one position."
      example_html: "An echo after 17.5 ms puts the moth 3.0 m away. <span class=\"legend\"><var>Δτ</var>: time difference between the ears, <var>b</var>: distance between the ears.</span>"
      svg_title: "Geometry of echo ranging"
      svg_desc: "A right triangle from the bat to the moth with distance d and angle theta, above a timeline showing the call and the echo 17.5 milliseconds later."
      svg_call: "Call"
      svg_echo: "Echo"
      svg_dt: "Δt = 17.5 ms"
    physical-ai:
      tab: "Physical AI"
    cs:
      tab: "Computer science"
      kicker: "Signal processing · Sonar"
      title: "From chirp to code"
      text: "Autonomous drones and parking sensors use the same trick. A matched filter slides the known chirp along the recording; the peak of the cross-correlation marks the echo – robust even in noise."
      code_label: "Python · NumPy"
  dimensions:
    eyebrow: "The ontology"
    title: "Four dimensions to map the living world"
    intro: "Every article is a node in a knowledge graph. Follow a phenomenon through time, across habitats, down to the physical rules behind it – and out into the sciences it inspires."
    items:
      - key: time
        title: "Time"
        sub: "Evolution & geology"
        text: "From the Big Bang to humanoid robots – and on to the open question of superintelligence: when did a solution appear, and how long did nature, or technology, refine it?"
        examples: ["Cambrian", "Cenozoic", "Age of AI"]
      - key: space
        title: "Space"
        sub: "Habitats & scales"
        text: "From the microcosm to the stratosphere: where does a phenomenon happen, and at what scale?"
        examples: ["Deep sea", "Desert", "Microcosm"]
      - key: rules
        title: "Rules"
        sub: "The laws of physics"
        text: "Mechanics, thermodynamics, optics, acoustics, electromagnetism: the rules every organism has to play by."
        examples: ["Acoustics", "Fluid dynamics", "Optics"]
      - key: adjacent
        title: "Adjacent sciences"
        sub: "Maths, AI & engineering"
        text: "Where the insight leads: mathematics, computer science, Physical AI and robotics, medical technology, materials science and bionics."
        examples: ["Bionics", "Physical AI", "Robotics"]
  flagship:
    eyebrow: "Flagship article"
    title: "The pistol shrimp and the physics of cavitation"
    text: "With a single snap of its oversized claw, a shrimp just a few centimetres long shoots out a jet of water so fast that the pressure behind it drops below the vapour pressure. A bubble forms and collapses – and for a split second its core reaches thousands of kelvin and emits a flash of light."
    stats:
      - value: "≈ 25 m/s"
        label: "speed of the water jet"
      - value: "≥ 5,000 K"
        label: "inside the collapsing bubble"
      - value: "3–5 cm"
        label: "body length of the shrimp"
    tags: ["Coral reefs", "Fluid dynamics", "Thermodynamics", "Acoustics", "Bionics"]
    sources_label: "Sources"
    cta: "Read the article"
    fig_label: "Fig. 2"
    fig_caption: "Life of a cavitation bubble: rapid growth, violent collapse, weak rebounds. The whole cycle takes less than a millisecond."
    svg_title: "Radius of a cavitation bubble over time"
    svg_desc: "The bubble radius rises after the snap, then drops steeply to zero at the collapse, where a flash and a shock wave occur, followed by two small rebounds."
    svg_radius: "Radius R"
    svg_time: "Time t"
    svg_snap: "Snap"
    svg_growth: "Vapour bubble grows"
    svg_collapse: "Collapse"
    svg_flash: "Flash & shock wave"
