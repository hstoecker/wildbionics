    robin_compass:
      title: "The robin's magnetic compass: it reads the tilt of Earth's field lines – according to the leading hypothesis with a light-driven radical pair in its eyes"
      desc: "Schematic. A European robin with orange-red face and breast perches on a twig. Earth's magnetic field lines run steeply downwards into the ground, at an angle to the horizon. A callout from the bird's eye shows a radical pair: two molecules, each with one unpaired electron whose spin is drawn as an arrow. Whether the two spins stay paired or not depends on the angle between the molecule and the field – according to the leading hypothesis, this gives the bird a visual signal of the field's direction."
