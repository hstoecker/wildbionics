  guide:
    nav: "Guide"
    url: "/contribute/"
    title: "Contribute to WildBionics"
    description: "How to contribute articles, corrections, translations and figures to WildBionics – with Claude or by hand, reviewed before anything goes live."
    eyebrow: "Open source"
    intro: "WildBionics grows with everyone who is curious. You can report mistakes, propose phenomena, write articles, translate, draw figures or improve the site – on your own or together with Claude. Every change is checked automatically and approved by a person before it goes live."
    ways_title: "Three ways to work"
    ways:
      - title: "Ask Claude on GitHub"
        text: "Collaborators write an issue or comment that mentions @claude – for example “@claude draft an article about how geckos stick to walls”. Claude researches, writes with the project’s skills and opens a pull request for review."
      - title: "Work with Claude Code"
        text: "Open the repository in the Claude desktop app, the terminal or on claude.ai/code. The WildBionics skills load automatically. Outside the repository you can install them from our plugin marketplace:"
      - title: "Work by hand"
        text: "Fork the repository, edit Markdown and YAML files, run the checks and open a pull request. The rules are the same – they are written down in CONTRIBUTING.md and in the skills."
    steps_title: "From idea to live page"
    steps:
      - "Open an issue: an article idea, a correction or a translation."
      - "Work on a branch with the matching skill – research, English text, figures, German translation, knowledge graph."
      - "Run the checks locally, review your own work, open a pull request."
      - "Automatic checks: terminology, structure, skills, SEO and links – plus a preview with screenshots and a review by Claude."
      - "The maintainer reads the review, looks at the preview and approves."
      - "Merged changes go live on wildbionics.com within minutes."
    live_note: "Nothing goes live without a person’s approval."
    rules_title: "Quality rules"
    rules:
      - "Every fact has a verifiable source, usually a peer-reviewed paper with DOI. Derived numbers are recalculated, code is run."
      - "Hypotheses such as superintelligence are presented as scenarios, never as facts."
      - "German texts use the correct technical terms from our glossary."
      - "Figures must be recognisable, conceptually clear, correct and attractive."
      - "Accessible (WCAG 2.2 AA), works without JavaScript, no new dependencies."
    skills_title: "The skills – our rulebook"
    skills_intro: "Skills are instructions that Claude loads when a task needs them. They are the same rules a human contributor follows."
    skills:
      - { name: "wildbionics-contribute", text: "orientation, workflow and setup – start here" }
      - { name: "wildbionics-article", text: "research, sources, structure, lenses, search and answer engines" }
      - { name: "wildbionics-translate", text: "English ⇄ German with the project glossary" }
      - { name: "wildbionics-figures", text: "conceptual figures that pass the quality bar" }
      - { name: "wildbionics-graph", text: "ontology and knowledge graph" }
      - { name: "wildbionics-design", text: "UI/UX, accessibility, front-end rules" }
      - { name: "wildbionics-review", text: "reviewing pull requests, with a fact-checking agent" }
    together_title: "Working together"
    together_text: "Families, classes and teams can work on WildBionics together: each person uses their own GitHub account and their own Claude access, the maintainer adds them as collaborators, and everyone contributes through pull requests. The review process keeps the quality the same, no matter who – or which agent – wrote a change."
    cta_repo: "Open the repository"
    cta_issue: "Propose a phenomenon"
    cta_guide: "Read CONTRIBUTING.md"
