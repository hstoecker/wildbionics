      desc: "Schema einer insektenfressenden Fledermaus, die sich einer Motte nähert. Entlang ihrer Flugbahn markieren Zeichen, wo sie Rufe zur Echoortung aussendet: in der Suchphase zum Beispiel alle 100 Millisekunden einen Ruf, in der Annäherung in immer kürzeren Abständen und im abschließenden Buzz bis zu etwa 200 Rufe pro Sekunde. Die Motte wirft jeden Ruf als Echo zurück. Eine Zeitachse darunter wiederholt die Rufe als Striche, die sich zum Fang hin zusammendrängen."
