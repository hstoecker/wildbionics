    early_atmosphere:
      title: "Sonne und Sauerstoff im Lauf der Erdgeschichte: eine schwächere Sonne und eine Luft ohne Sauerstoff, bis Einzeller sie veränderten"
      desc: "Schematische Zeitleiste von vor 4,5 Milliarden Jahren bis heute. Oben: Die Helligkeit der Sonne wächst von etwa 74 Prozent des heutigen Werts vor 4 Milliarden Jahren auf 100 Prozent. Mitte: Sauerstoff in der Luft, schematisch – praktisch keiner bis zur Großen Sauerstoffkatastrophe vor 2,4 bis 2,3 Milliarden Jahren, danach wenig, aber vorhanden, nahe am heutigen Wert erst in den letzten paar hundert Millionen Jahren. Unten: erstes Leben vor mindestens 3,5 bis 3,8 Milliarden Jahren, Cyanobakterien wahrscheinlich vor 3,2 bis 2,7 Milliarden Jahren, der Anstieg des Sauerstoffs und die kambrische Explosion der Tiere vor etwa 540 Millionen Jahren."
