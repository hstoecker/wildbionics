    bernoulli:
      title: "Static pressure in a water jet as a function of its speed"
      desc: "According to Bernoulli, the static pressure falls with the square of the jet speed. Above about 14 metres per second it drops below the vapour pressure of water and cavitation sets in. The shrimp's jet reaches about 25 metres per second."
      x: "Jet speed v (m/s)"
      y: "Static pressure p (kPa)"
