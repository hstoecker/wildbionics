# UI strings per language. Usage in templates:
#   {% assign t = site.data.i18n[page.lang] %} … {{ t.hero.title }}
# To add a language, copy the `en` block and translate every value.

en:
  lang_name: "English"
  skip: "Skip to content"
  og_image_alt: "WildBionics preview card: “Nature’s physics, explained.” – a bat sends ultrasound calls towards a moth; the echo returns after 17.5 ms, so the moth is 3.0 m away."
  nav:
    label: "Main"
    lens: "Lenses"
