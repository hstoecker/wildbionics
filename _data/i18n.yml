    insect_flight:
      title: "A hovering honeybee: its wings sweep forward and back about 230 times per second, and a leading-edge vortex on each wing creates extra lift"
      desc: "Schematic side view of a honeybee hovering in the air, recognisable by its striped abdomen, hairy thorax, large compound eye, elbowed antennae, legs with a pollen load and two pairs of transparent wings. A dotted arc above the bee shows the path of the wingtip: the wings sweep forward and back through about 90 degrees, roughly 230 times per second, and flip over at each end of the stroke. The wing at the front end of the stroke is drawn solid, the wing at the back end faded. A magnifying circle shows the cross-section of the wing as it moves forward at a steep angle: the air rolls up into a spiral leading-edge vortex on the upper side, just behind the leading edge, and a large arrow pointing up shows the lift."
