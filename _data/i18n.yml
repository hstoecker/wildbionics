    together_title: "Working together"
    together_text: "Families, classes and teams can work on WildBionics together: everyone uses their own GitHub account and Claude access, the maintainer adds them as collaborators, and all contributions arrive as pull requests. The review keeps the quality the same, no matter who – or which agent – wrote a change."
    cta_repo: "Open the repository"
    cta_topic: "Propose a phenomenon"
    hero_contact_html: "Questions first? Ask in <a href=\"https://github.com/hstoecker/wildbionics/discussions\">Discussions</a> or write to [email]."
    jump_topics: "Suggest a topic"
    jump_contact: "Contact"
    topics_title: "Bring your topic – from class, lab or kitchen table"
    topics_intro: "Whatever you are working on right now can become a WildBionics page. Suggest it – our goal is a new page every day."
    topics_note: "Topics with a reason why they fascinate and, ideally, a source come first. Need a page by a certain date, for a lesson or a project? Say so in the form."
    topics_cta: "Suggest a topic"
    audiences:
      - { title: "Teachers", text: "Suggest the topic of your next lesson – with a date, so the page can be ready in time. Every page has lenses for several subjects and code your class can run." }
