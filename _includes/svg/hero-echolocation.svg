{%- include i18n.html -%}
<svg class="hero-svg" viewBox="0 0 720 560" role="img" aria-labelledby="hero-svg-title hero-svg-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hero-svg-title">{{ t.hero.svg_title }}</title>
  <desc id="hero-svg-desc">{{ t.hero.svg_desc }}</desc>
  <defs>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="currentColor" stroke-width=".6"/>
    </pattern>
    <radialGradient id="hero-fade" cx="45%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hero-grid-mask"><rect width="720" height="560" fill="url(#hero-fade)"/></mask>
    <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="var(--signal)" stop-opacity=".22"/>
      <stop offset="1" stop-color="var(--signal)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="hero-grid" width="720" height="560" fill="url(#hero-grid)" mask="url(#hero-grid-mask)"/>
  <circle cx="190" cy="300" r="170" fill="url(#hero-glow)"/>

  <!-- Local frame: origin = bat's head, x-axis points at the moth (383 px ≙ 3.0 m). -->
  <g transform="translate(190 300) rotate(-15.1)">
    <g class="wave wave-call" fill="none">
      <path style="--i:0" d="M88.3,-46.9 A100,100 0 0 1 88.3,46.9"/>
      <path style="--i:1" d="M134.2,-71.4 A152,152 0 0 1 134.2,71.4"/>
      <path style="--i:2" d="M180.1,-95.8 A204,204 0 0 1 180.1,95.8"/>
      <path style="--i:3" d="M226.0,-120.2 A256,256 0 0 1 226.0,120.2"/>
      <path style="--i:4" d="M271.9,-144.6 A308,308 0 0 1 271.9,144.6"/>
    </g>
    <g class="wave wave-echo" fill="none">
      <path style="--i:0" d="M351.5,12.7 A34,34 0 0 1 351.5,-12.7"/>
      <path style="--i:1" d="M320,25.5 A68,68 0 0 1 320,-25.5"/>
      <path style="--i:2" d="M288.4,38.2 A102,102 0 0 1 288.4,-38.2"/>
    </g>
    <line class="ray" x1="30" y1="0" x2="364" y2="0"/>
    <!-- Dimension line -->
    <g class="dim">
      <path d="M0,78 V102 M383,78 V102 M0,90 H383"/>
      <path d="M0,90 l9,-4 v8 Z M383,90 l-9,-4 v8 Z" class="dim-arrow"/>
      <text x="206" y="112" text-anchor="middle" class="label label-dim">{{ t.hero.svg_distance }}</text>
    </g>
    <use href="#moth" class="moth" x="353" y="-20" width="60" height="40" transform="rotate(15.1 383 0)"/>
  </g>

  <use href="#bat" class="bat" x="90" y="279.0" width="200" height="61.3"/>

  <!-- Callouts (unrotated) -->
  <g class="callout">
    <path d="M338.9,160.6 V118 H359.9"/>
    <circle cx="338.9" cy="160.6" r="2.5"/>
    <text x="365.9" y="122" class="label">{{ t.hero.svg_call }}</text>
  </g>
  <g class="callout callout-echo">
    <path d="M458.5,188 V150 H478"/>
    <circle cx="458.5" cy="188" r="2.5"/>
    <text x="484" y="154" class="label label-echo">{{ t.hero.svg_echo }}</text>
  </g>
  <text x="596" y="226" class="label label-muted">{{ t.hero.svg_moth }}</text>

  <!-- Spectrogram inset: x 44 px/ms, y 0.9 px/kHz -->
  <g class="inset" transform="translate(0 6)">
    <rect x="436" y="392" width="266" height="132" rx="6" class="inset-bg"/>
    <text x="452" y="414" class="label label-muted">{{ t.hero.svg_spectrogram }} · kHz</text>
    <path class="axis" d="M470,423 V505 H690"/>
    <path class="tick" d="M466,433 H470 M466,469 H470 M470,505 V509 M602,505 V509"/>
    <text x="462" y="436" text-anchor="end" class="label label-tick">80</text>
    <text x="462" y="472" text-anchor="end" class="label label-tick">40</text>
    <text x="470" y="520" text-anchor="middle" class="label label-tick">0</text>
    <text x="602" y="520" text-anchor="middle" class="label label-tick">3 ms</text>
    <path class="chirp" d="M470,433 C500,452 540,464 602,469"/>
  </g>
</svg>
