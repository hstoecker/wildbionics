{%- include i18n.html -%}
{%- assign r = t.figures.walking -%}
<svg class="wk-svg" viewBox="0 0 720 470" role="img" aria-labelledby="wk-title" aria-describedby="wk-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="wk-title">{{ r.title }}</title>
  <desc id="wk-desc">{{ r.desc }}</desc>
  <defs>
    <pattern id="wk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="currentColor" stroke-width=".6"/>
    </pattern>
    <radialGradient id="wk-fade" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="wk-mask"><rect width="720" height="470" fill="url(#wk-fade)"/></mask>
    <linearGradient id="wk-skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9805e"/>
      <stop offset="1" stop-color="#dba582"/>
    </linearGradient>
    <linearGradient id="wk-shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6f8c"/>
      <stop offset="1" stop-color="#4b93b0"/>
    </linearGradient>
    <linearGradient id="wk-trousers" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4350"/>
      <stop offset="1" stop-color="#58626f"/>
    </linearGradient>
    <linearGradient id="wk-panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb8bd"/>
      <stop offset="1" stop-color="#e6ecee"/>
    </linearGradient>
    <linearGradient id="wk-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2ea" stop-opacity="0"/>
      <stop offset=".12" stop-color="#eef2ea" stop-opacity=".55"/>
      <stop offset=".88" stop-color="#eef2ea" stop-opacity=".55"/>
      <stop offset="1" stop-color="#eef2ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="grid" width="720" height="470" fill="url(#wk-grid)" mask="url(#wk-mask)"/>
  <path class="ground" d="M20 382 H700"/>
  <!-- the human -->
  <g class="wk-human">
    <path class="skin skin--far" d="M169.0,143.1 L151.7,189.9 A7.0,7.0 0 0 0 164.7,195.2 L184.8,149.4 A8.5,8.5 0 0 0 169.0,143.1 Z"/>
    <path class="skin skin--far" d="M151.8,191.9 L148.7,235.8 A5.0,5.0 0 0 0 158.6,236.8 L164.7,193.3 A6.5,6.5 0 0 0 151.8,191.9 Z"/>
    <ellipse class="skin skin--far" cx="153.7" cy="240.1" rx="5.5" ry="7.5"/>
    <path class="trousers trousers--far" d="M159.5,238.4 L192.4,302.3 A10.0,10.0 0 0 0 210.6,294.2 L185.1,227.0 A14.0,14.0 0 0 0 159.5,238.4 Z"/>
    <path class="trousers trousers--far" d="M192.8,292.5 L156.2,352.1 A7.0,7.0 0 0 0 167.8,360.0 L209.3,303.7 A10.0,10.0 0 0 0 192.8,292.5 Z"/>
    <path class="shoe shoe--far" d="M149.5,357.4 Q149.9,360.2 171.1,376.8 Q177.7,378.1 178.2,370.9 Q168.7,357.1 161.9,348.0 Q153.0,351.2 149.5,357.4 Z"/>
    <path class="trousers" d="M157.1,233.5 L164.1,301.1 A10.5,10.5 0 0 0 185.0,300.3 L187.0,232.4 A15.0,15.0 0 0 0 157.1,233.5 Z"/>
    <path class="trousers" d="M164.0,300.3 L166.0,371.2 A7.0,7.0 0 0 0 180.0,371.5 L185.0,300.7 A10.5,10.5 0 0 0 164.0,300.3 Z"/>
    <path class="shoe" d="M164.0,380.0 Q166.0,382.0 194.0,382.0 Q200.0,379.0 196.0,373.0 Q179.0,368.0 168.0,365.0 Q163.0,373.0 164.0,380.0 Z"/>
    <path class="shirt" d="M155.0,236.0 C152.0,202.0 155.0,186.0 160.0,150.0 Q165.0,137.0 179.0,137.0 Q193.0,139.0 196.0,156.0 C200.0,186.0 190.0,196.0 188.0,236.0 Z"/>
    <path class="belt" d="M155.0,230.0 L188.0,230.0"/>
    <path class="skin" d="M184.9,143.2 L187.4,129.1 A6.5,6.5 0 0 0 174.7,126.4 L171.2,140.3 A7.0,7.0 0 0 0 184.9,143.2 Z"/>
    <path class="skin" d="M167.0,108.0 C166.0,92.0 180.0,87.0 190.0,91.0 C197.0,95.0 198.0,104.0 198.0,109.0 L203.0,116.0 L198.0,118.0 C199.0,121.0 197.0,124.0 197.0,125.0 C197.0,130.0 192.0,133.0 185.0,132.0 C176.0,131.0 170.0,124.0 168.0,117.0 Z"/>
    <path class="hair" d="M167.0,114.0 C163.0,94.0 178.0,84.0 191.0,90.0 C197.0,93.0 199.0,99.0 198.0,103.0 C191.0,99.0 184.0,100.0 179.0,104.0 C176.0,108.0 174.0,114.0 172.0,118.0 Z"/>
    <path class="ear" d="M179.0,111.0 q-4,1 -4,6 q0,5 4,5"/>
    <path class="brow" d="M190.0,107.0 l6,0.5"/>
    <path class="sleeve" d="M168.8,149.7 L189.4,195.2 A7.0,7.0 0 0 0 202.3,190.0 L185.5,143.0 A9.0,9.0 0 0 0 168.8,149.7 Z"/>
    <path class="skin" d="M191.9,197.6 L227.5,223.5 A5.0,5.0 0 0 0 233.6,215.6 L199.9,187.4 A6.5,6.5 0 0 0 191.9,197.6 Z"/>
    <ellipse class="skin" cx="233.4" cy="221.4" rx="7" ry="5.5" transform="rotate(40 233.4 221.4)"/>
    <path class="shirt" d="M168.0,150.4 L177.6,170.1 A8.5,8.5 0 0 0 193.3,163.8 L186.5,142.9 A10.0,10.0 0 0 0 168.0,150.4 Z"/>
    </g>
  <g class="wk-pend">
    <path class="ghost-rod" d="M172.0,382.0 L116.1,250.4"/>
    <circle class="ghost-bob" cx="113.4" cy="243.9" r="6"/>
    <path class="ghost-rod" d="M172.0,382.0 L227.9,250.4"/>
    <circle class="ghost-bob" cx="230.6" cy="243.9" r="6"/>
    <path class="arc" d="M120.8,241.0 A150,150 0 0 1 223.2,241.0"/>
    <path class="arc-head" d="M212.1,237.5 L199.2,240.1 L201.6,229.4 Z"/>
    <path class="rod" d="M172.0,382.0 L172.0,232.0"/>
    <circle class="bob" cx="172.0" cy="232.0" r="8"/>
    <path class="pivot" d="M172.0,382.0 l-9,9 h18 Z"/>
    </g>
  <!-- the humanoid robot: same joints, same pendulum -->
  <g class="wk-robot">
    <rect class="panel panel--far" x="0" y="-6.5" width="50.0" height="13.0" rx="5" transform="translate(553.0,146.0) rotate(112.0)"/>
    <rect class="panel panel--far" x="0" y="-5.5" width="44.0" height="11.0" rx="5" transform="translate(534.3,192.4) rotate(96.0)"/>
    <circle class="joint joint--far" cx="534.3" cy="192.4" r="6"/>
    <rect class="panel panel--far" x="524.7" y="234.1" width="10" height="13" rx="3"/>
    <rect class="panel panel--far" x="0" y="-9.5" width="72.0" height="19.0" rx="5" transform="translate(548.0,232.0) rotate(66.0)"/>
    <rect class="panel panel--far" x="0" y="-7.5" width="70.0" height="15.0" rx="5" transform="translate(577.3,297.8) rotate(124.0)"/>
    <circle class="joint joint--far" cx="577.3" cy="297.8" r="8"/>
    <path class="panel panel--far" d="M529.1,357.8 l30,13 l-3,7 l-31,-11 Z" />
    <rect class="panel" x="0" y="-10.5" width="68.0" height="21.0" rx="5" transform="translate(548.0,232.0) rotate(87.9)"/>
    <rect class="panel" x="0" y="-8.0" width="71.0" height="16.0" rx="5" transform="translate(550.5,300.0) rotate(91.2)"/>
    <circle class="joint" cx="550.5" cy="300.0" r="8.5"/>
    <path class="sole" d="M537.0,382.0 L577.0,382.0 L575.0,374.0 L553.0,369.0 L539.0,369.0 Z"/>
    <circle class="joint" cx="549.0" cy="371.0" r="6"/>
    <rect class="panel" x="530.0" y="218.0" width="36" height="24" rx="7"/>
    <rect class="joint" x="539.0" y="202.0" width="18" height="20" rx="4"/>
    <path class="panel panel--chest" d="M533.0,140.0 L572.0,140.0 Q578.0,141.0 577.0,150.0 L570.0,200.0 Q569.0,206.0 562.0,206.0 L540.0,206.0 Q534.0,206.0 533.0,200.0 L528.0,150.0 Q527.0,140.0 533.0,140.0 Z"/>
    <path class="seam" d="M535.0,168.0 L572.0,168.0"/>
    <path class="trim" d="M537.0,180.0 L570.0,180.0"/>
    <rect class="joint" x="550.0" y="126.0" width="11" height="14" rx="3"/>
    <rect class="panel panel--head" x="541.0" y="90.0" width="34" height="40" rx="13"/>
    <path class="visor" d="M556.0,103.0 L575.0,103.0 L575.0,116.0 L556.0,116.0 Q552.0,109.5 556.0,103.0 Z"/>
    <path class="visor-shine" d="M560.0,106.0 L571.0,106.0"/>
    <rect class="panel" x="0" y="-7.0" width="50.0" height="14.0" rx="5" transform="translate(553.0,146.0) rotate(68.0)"/>
    <rect class="panel" x="0" y="-6.0" width="44.0" height="12.0" rx="5" transform="translate(571.7,192.4) rotate(38.0)"/>
    <circle class="joint" cx="571.7" cy="192.4" r="6.5"/>
    <rect class="joint" x="601.4" y="215.4" width="11" height="13" rx="4" transform="rotate(-38 606.4,219.4)"/>
    <circle class="joint" cx="553.0" cy="146.0" r="9"/>
    <circle class="joint" cx="548.0" cy="232.0" r="8.5"/>
    </g>
  <g class="wk-pend">
    <path class="ghost-rod" d="M548.0,382.0 L492.1,250.4"/>
    <circle class="ghost-bob" cx="489.4" cy="243.9" r="6"/>
    <path class="ghost-rod" d="M548.0,382.0 L603.9,250.4"/>
    <circle class="ghost-bob" cx="606.6" cy="243.9" r="6"/>
    <path class="arc" d="M496.8,241.0 A150,150 0 0 1 599.2,241.0"/>
    <path class="arc-head" d="M588.1,237.5 L575.2,240.1 L577.6,229.4 Z"/>
    <path class="rod" d="M548.0,382.0 L548.0,232.0"/>
    <circle class="bob" cx="548.0" cy="232.0" r="8"/>
    <path class="pivot" d="M548.0,382.0 l-9,9 h18 Z"/>
    </g>
  <!-- legend in the middle: one key for both walkers -->
  <g class="label">
    <text class="label-strong label-accent" x="360" y="52" text-anchor="middle">{{ r.same }}</text>
    <text class="label-tick label-note" x="20" y="22">{{ r.note }}</text>
    <g class="wk-key" transform="translate(286 158)">
      <path class="arc" d="M0 14 A40,40 0 0 1 22 14"/>
      <path class="arc-head" d="M26 17 L17 15.5 L21 9.5 Z"/>
      <text x="34" y="18">{{ r.arc }}</text>
      <circle class="bob" cx="11" cy="56" r="7"/>
      <text x="34" y="52">{{ r.bob_1 }}</text>
      <text x="34" y="74">{{ r.bob_2 }}</text>
      <path class="rod" d="M11 104 V136"/>
      <text class="label-signal label-strong" x="34" y="116">{{ r.rod_1 }}</text>
      <text class="label-signal label-strong" x="34" y="138">{{ r.rod_2 }}</text>
      <path class="pivot" d="M11 168 l-9,9 h18 Z"/>
      <text x="34" y="180">{{ r.pivot }}</text>
    </g>
    <text class="label-title" x="172" y="432" text-anchor="middle">{{ r.human }}</text>
    <text class="label-taxon" x="172" y="454" text-anchor="middle">{{ r.taxon }}</text>
    <text class="label-title" x="548" y="432" text-anchor="middle">{{ r.robot }}</text>
    <text class="label-tick" x="548" y="454" text-anchor="middle">{{ r.robot_sub }}</text>
  </g>
</svg>
