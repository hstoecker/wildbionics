{%- include i18n.html -%}
<svg class="lens-svg" viewBox="0 0 480 300" role="img" aria-labelledby="lens-physics-title lens-physics-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lens-physics-title">{{ t.lens.physics.svg_title }}</title>
  <desc id="lens-physics-desc">{{ t.lens.physics.svg_desc }}</desc>
  <g class="fronts" fill="none">
    <circle cx="150" cy="150" r="190"/>
    <circle cx="170" cy="150" r="152"/>
    <circle cx="190" cy="150" r="114"/>
    <circle cx="210" cy="150" r="76"/>
    <circle cx="230" cy="150" r="38"/>
  </g>
  <path class="guide" d="M0,150 H480"/>
  <use href="#bat" class="bat bat-ink" x="205" y="140" width="90" height="28"/>
  <use href="#moth" class="moth moth-ink" x="422" y="136" width="40" height="27"/>
  <path class="vec" d="M232,196 H294"/>
  <path class="vec-arrow" d="M300,196 l-10,-5 v10 Z"/>
  <text x="264" y="218" text-anchor="middle" class="math">v</text>
  <rect x="8" y="12" width="228" height="28" rx="14" class="chip-bg"/>
  <text x="122" y="30.5" text-anchor="middle" class="label label-muted">{{ t.lens.physics.svg_behind }}</text>
  <rect x="244" y="12" width="228" height="28" rx="14" class="chip-bg chip-accent"/>
  <text x="358" y="30.5" text-anchor="middle" class="label">{{ t.lens.physics.svg_ahead }}</text>
</svg>
