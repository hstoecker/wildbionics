    <path class="tick tick--buzz" d="M464.4,336 V352"/>
    <path class="tick tick--buzz" d="M466.7,336 V352"/>
    <path class="tick tick--buzz" d="M468.9,336 V352"/>
    <path class="tick tick--buzz" d="M471.1,336 V352"/>
    <path class="tick tick--buzz" d="M473.3,336 V352"/>
    <path class="tick tick--buzz" d="M475.5,336 V352"/>
    <path class="tick tick--buzz" d="M477.8,336 V352"/>
    <path class="tick tick--buzz" d="M480.0,336 V352"/>
    <path class="tick tick--buzz" d="M482.2,336 V352"/>
    <path class="tick tick--buzz" d="M484.4,336 V352"/>
    <path class="tick tick--buzz" d="M486.7,336 V352"/>
    <path class="tick tick--buzz" d="M488.9,336 V352"/>
    <path class="tick tick--buzz" d="M491.1,336 V352"/>
    <path class="tick tick--buzz" d="M493.3,336 V352"/>
    <path class="tick tick--buzz" d="M495.6,336 V352"/>
    <path class="tick tick--buzz" d="M497.8,336 V352"/>
    <path class="tick tick--buzz" d="M500.0,336 V352"/>
