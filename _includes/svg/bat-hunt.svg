  <text x="70.0" y="374" class="label label-tick">0</text>
  <text x="530.0" y="374" text-anchor="end" class="label label-tick">{{ b.time }}</text>
  <text x="70.0" y="408" class="label label-tick">{{ b.note }}</text>
</svg>
