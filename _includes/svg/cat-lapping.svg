{%- include i18n.html -%}
{%- assign c = t.figures.cat_lapping -%}
<svg class="lapping-svg" viewBox="0 0 720 410" role="img" aria-labelledby="lapping-title" aria-describedby="lapping-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="lapping-title">{{ c.title }}</title>
  <desc id="lapping-desc">{{ c.desc }}</desc>
  <defs>
    <pattern id="lapping-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="currentColor" stroke-width=".6"/>
    </pattern>
    <radialGradient id="lapping-fade" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="lapping-mask"><rect width="720" height="410" fill="url(#lapping-fade)"/></mask>
    <linearGradient id="lapping-neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c2c5" stop-opacity="1"/>
      <stop offset="1" stop-color="#b9c2c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lapping-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb6d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2f6f8f" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect class="grid" width="720" height="410" fill="url(#lapping-grid)" mask="url(#lapping-mask)"/>

  <!-- Water in a wide bowl -->
  <rect class="water" x="20" y="250" width="680" height="34" fill="url(#lapping-water)"/>
  <path class="surface" d="M20,250 H700"/>

  <g class="stage">
      
      <path class="tongue" d="M128,200 C126,223.0 120,228 116,246 C115,251 130,251 134,244"/>
      <g transform="translate(140 196)"><g class="head">
        <path class="neck" d="M58,-68 C92,-66 116,-58 136,-50 C140,-36 140,-20 134,-8 C112,-4 90,-2 66,-4 Z" fill="url(#lapping-neck)"/>
        <ellipse cx="38" cy="-34" rx="50" ry="40"/>
        <path d="M18,-64 L22,-104 L48,-72 Z M52,-70 L70,-106 L82,-62 Z"/>
        <path class="ear-inner" d="M24,-70 L26,-94 L42,-74 Z M58,-72 L70,-96 L76,-66 Z"/>
        <ellipse cx="-6" cy="-16" rx="30" ry="19"/>
        <g transform="rotate(34 6 -2)"><path class="jaw" d="M8,-4 C-4,-4 -18,-4 -25,-1 C-30,2 -27,9 -18,9 C-8,9 2,7 10,4 Z"/></g>
        <path class="nose" d="M-37,-24 L-30,-29 L-29,-20 Z"/>
        <ellipse class="eye" cx="14" cy="-42" rx="6" ry="8"/>
        <ellipse class="pupil" cx="12" cy="-42" rx="1.8" ry="6.5"/>
        <path class="whisker" d="M-20,-12 L-62,-20 M-20,-9 L-62,-6 M-18,-6 L-58,6"/>
      </g></g>
    </g>
    <g class="stage">
      <path class="column" d="M340,250 C346,234 344,224 346,226 L364,226 C366,224 364,234 372,250 Z"/>
      <path class="tongue" d="M358,200 C356,208 350,216 348,222 L362,222"/>
      <g transform="translate(370 196)"><g class="head">
        <path class="neck" d="M58,-68 C92,-66 116,-58 136,-50 C140,-36 140,-20 134,-8 C112,-4 90,-2 66,-4 Z" fill="url(#lapping-neck)"/>
        <ellipse cx="38" cy="-34" rx="50" ry="40"/>
        <path d="M18,-64 L22,-104 L48,-72 Z M52,-70 L70,-106 L82,-62 Z"/>
        <path class="ear-inner" d="M24,-70 L26,-94 L42,-74 Z M58,-72 L70,-96 L76,-66 Z"/>
        <ellipse cx="-6" cy="-16" rx="30" ry="19"/>
        <g transform="rotate(30 6 -2)"><path class="jaw" d="M8,-4 C-4,-4 -18,-4 -25,-1 C-30,2 -27,9 -18,9 C-8,9 2,7 10,4 Z"/></g>
        <path class="nose" d="M-37,-24 L-30,-29 L-29,-20 Z"/>
        <ellipse class="eye" cx="14" cy="-42" rx="6" ry="8"/>
        <ellipse class="pupil" cx="12" cy="-42" rx="1.8" ry="6.5"/>
        <path class="whisker" d="M-20,-12 L-62,-20 M-20,-9 L-62,-6 M-18,-6 L-58,6"/>
      </g></g>
    </g>
    <g class="stage">
      <path class="column" d="M574,250 C578,238 578,230 585,224 C592,230 592,238 598,250 Z"/><circle class="column" cx="585" cy="216" r="3.5"/><ellipse class="column" cx="588" cy="198" rx="8" ry="4"/>
      
      <g transform="translate(600 196)"><g class="head">
        <path class="neck" d="M58,-68 C92,-66 116,-58 136,-50 C140,-36 140,-20 134,-8 C112,-4 90,-2 66,-4 Z" fill="url(#lapping-neck)"/>
        <ellipse cx="38" cy="-34" rx="50" ry="40"/>
        <path d="M18,-64 L22,-104 L48,-72 Z M52,-70 L70,-106 L82,-62 Z"/>
        <path class="ear-inner" d="M24,-70 L26,-94 L42,-74 Z M58,-72 L70,-96 L76,-66 Z"/>
        <ellipse cx="-6" cy="-16" rx="30" ry="19"/>
        <g transform="rotate(6 6 -2)"><path class="jaw" d="M8,-4 C-4,-4 -18,-4 -25,-1 C-30,2 -27,9 -18,9 C-8,9 2,7 10,4 Z"/></g>
        <path class="nose" d="M-37,-24 L-30,-29 L-29,-20 Z"/>
        <ellipse class="eye" cx="14" cy="-42" rx="6" ry="8"/>
        <ellipse class="pupil" cx="12" cy="-42" rx="1.8" ry="6.5"/>
        <path class="whisker" d="M-20,-12 L-62,-20 M-20,-9 L-62,-6 M-18,-6 L-58,6"/>
      </g></g>
    </g>

  <!-- Forces in stage 2 -->
  <g class="force force--up"><path d="M384,244 V206"/><path class="force-head" d="M384,200 l-6,10 h12 Z"/></g>
  <text x="394" y="230" class="label label-accent">{{ c.inertia }}</text>
  <g class="force force--down"><path d="M324,206 V240"/><path class="force-head" d="M324,246 l-6,-10 h12 Z"/></g>
  <text x="316" y="228" text-anchor="end" class="label label-signal">{{ c.gravity }}</text>

  <g class="marker"><circle cx="200" cy="280" r="10"/><text x="200" y="284.5" text-anchor="middle">1</text></g>
  <g class="marker"><circle cx="430" cy="280" r="10"/><text x="430" y="284.5" text-anchor="middle">2</text></g>
  <g class="marker"><circle cx="660" cy="280" r="10"/><text x="660" y="284.5" text-anchor="middle">3</text></g>

  <!-- Legend -->
  <text x="40" y="330" class="label">1 {{ c.s1 }}</text>
  <text x="40" y="353" class="label">2 {{ c.s2 }}</text>
  <text x="40" y="376" class="label">3 {{ c.s3 }}</text>
  <text x="40" y="402" class="label label-tick">{{ c.note }}</text>
</svg>
