    <path class="toe" d="M100,268 L76.5,268.4"/>
    <ellipse class="toepad" cx="81.1" cy="268.3" rx="3.8" ry="7.6" transform="rotate(269 81.1 268.3)"/>
    <path class="toe" d="M250,268 L273.5,268.4"/>
