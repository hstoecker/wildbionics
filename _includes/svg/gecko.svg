{%- include i18n.html -%}
{%- assign g = t.figures.gecko -%}
<svg class="gecko-svg" viewBox="0 0 720 432" role="img" aria-labelledby="gecko-title" aria-describedby="gecko-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="gecko-title">{{ g.title }}</title>
  <desc id="gecko-desc">{{ g.desc }}</desc>
  <defs>
    <linearGradient id="gecko-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9bccb"/>
      <stop offset=".55" stop-color="#7f95a9"/>
      <stop offset="1" stop-color="#5d7288"/>
    </linearGradient>
    <linearGradient id="gecko-pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d9c2"/>
      <stop offset="1" stop-color="#bda888"/>
    </linearGradient>
    <radialGradient id="gecko-lens" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#16333d"/>
      <stop offset="1" stop-color="#0a1c23"/>
    </radialGradient>
    <pattern id="gecko-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="currentColor" stroke-width=".6"/>
    </pattern>
    <radialGradient id="gecko-fade" cx="40%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gecko-mask"><rect width="720" height="420" fill="url(#gecko-fade)"/></mask>
    <clipPath id="gecko-c1"><circle cx="402" cy="108" r="66"/></clipPath>
    <clipPath id="gecko-c2"><circle cx="548" cy="214" r="66"/></clipPath>
    <clipPath id="gecko-c3"><circle cx="630" cy="322" r="66"/></clipPath>
  </defs>

  <rect class="hero-grid" width="720" height="420" fill="url(#gecko-grid)" mask="url(#gecko-mask)"/>

