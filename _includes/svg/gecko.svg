  <!-- ===== Labels ===== -->
  <text x="24" y="338" class="label label-title">{{ g.animal }}</text>
  <text x="24" y="358" class="label label-muted label-taxon">{{ g.taxon }}</text>
  <text x="478" y="44" class="label label-strong">{{ g.toe }}</text>
  <text x="478" y="62" class="label label-muted">{{ g.toe_size }}</text>
  <text x="476" y="206" text-anchor="end" class="label label-strong">{{ g.setae }}</text>
