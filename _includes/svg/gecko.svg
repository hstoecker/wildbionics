  <!-- ===== Zoom chain: toe pad → setae → spatulae ===== -->
  <g class="zoom">
    <circle cx="254" cy="92" r="30"/>
    <path d="M268,66 L372,48 M276,110 L350,150"/>
    <path d="M458,142 L494,178 M436,164 L486,244"/>
    <path d="M596,256 L604,262 M566,274 L570,308"/>
  </g>

