{%- comment -%}
  Contact address without spam bait: the HTML (and the repository) never holds the address in one
  piece. Without JavaScript readers see "contribute (at) wildbionics.com" (one click selects it all,
  CSS user-select) plus a <noscript> hint how to write it; assets/js/email.js turns every
  [data-email] into a mailto link. The domain is site.contact_domain (_config.yml), not derived
  from site.url, so a preview or staging URL never changes the address.
  Params: user (local part), class (optional, for the link).
{%- endcomment -%}
{%- assign email_domain = site.contact_domain -%}
<span class="email-fallback" data-email="{{ include.user }}" data-domain="{{ email_domain }}"{% if include.class %} data-class="{{ include.class }}"{% endif %}>{{ include.user }} (at) {{ email_domain }}</span><noscript> <small class="email-hint">{{ t.footer.email_hint }}</small></noscript>
{%- comment -%} Whitespace control on this tag removes the line breaks around it, so a full stop
  right after the include ("write to … .") gets no space before it. {%- endcomment -%}
