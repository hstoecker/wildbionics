        <path d="M6 27 C5 15 15 6 27 7 C38 8 44 17 42 27 C40 37 31 43 21 41 C12 39 7 34 6 27 Z"/>
        <path d="M12 26 C12 18 18 12 26 13 C33 14 37 20 36 27 C35 33 29 37 22 35 C16 34 12 31 12 26 Z" opacity=".75"/>
        <path d="M18 25 C18 21 21 18 25 19 C29 19 31 23 30 26 C29 30 26 31 23 30 C20 29 18 28 18 25 Z" opacity=".55"/>
