    </g>
    <symbol id="bat" viewBox="-124 -44 248 76" overflow="visible">
      <use href="#bat-wing"/>
      <use href="#bat-wing" transform="scale(-1,1)"/>
      <path class="bat-body" d="M-6,-22 L-9,-35 L-2,-25 Z M6,-22 L9,-35 L2,-25 Z"/>
      <circle class="bat-body" cx="0" cy="-18" r="7.5"/>
      <ellipse class="bat-body" cx="0" cy="2" rx="7" ry="15"/>
      <path class="bat-body" d="M-6,13 Q0,27 6,13 Z"/>
    </symbol>
    <!-- Moth, dorsal view. Origin = centre of thorax. -->
