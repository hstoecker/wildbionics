        <path d="M13 13 L34 10 L25 28 Z M25 28 L39 37 M25 28 L10 37 M13 13 L10 37" opacity=".55"/>
        <circle cx="13" cy="13" r="3.5" fill="var(--card-bg, #fff)"/>
        <circle cx="34" cy="10" r="3.5" fill="var(--card-bg, #fff)"/>
        <circle cx="25" cy="28" r="4.5" fill="currentColor"/>
        <circle cx="39" cy="37" r="3.5" fill="var(--card-bg, #fff)"/>
        <circle cx="10" cy="37" r="3.5" fill="var(--card-bg, #fff)"/>
