# @claude in issues and pull requests: Claude works on the request with the WildBionics
# skills, pushes a branch and posts a link to create the pull request – which then goes through
# all checks and the maintainer's approval like any other contribution. Meant for small, focused
# tasks: a run has a turn limit and uses the maintainer's Claude tokens (whole articles: Claude Code). Only people with write access can trigger it.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) and the Claude GitHub App.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6      # code_examples.py runs every code example
        with:
          python-version: "3.12"
      - run: python -m pip install -r examples/requirements.txt
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 120
            --allowedTools "Edit,Write,Read,Glob,Grep,WebFetch,WebSearch,Task,Bash(ruby .github/scripts/*),Bash(python3 *),Bash(bundle install*),Bash(bundle exec jekyll build*),Bash(curl -s *),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(ls *)"
            --append-system-prompt "You work on WildBionics. Start with the wildbionics-contribute skill, follow the matching WildBionics skills (article, translate, figures, graph, design), run the gates from wildbionics-contribute and self-review with wildbionics-review before you finish. Commit and push your branch after every major step, so the work survives if the run stops early. Never push to main."
