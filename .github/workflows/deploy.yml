# Quality gates (terms, content, plugin, code examples) → build → (PR: preview) → deploy to GitHub Pages → IndexNow.
# Rules behind every gate: plugins/wildbionics/skills (see wildbionics-contribute).
name: Build, check & deploy

on:
  push:
    branches: [main]
  pull_request:          # checks + preview only, never deploys
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # the plugin gate compares against the PR base
      - name: Translation gate (German technical terms, EN/DE consistency, typography)
        run: ruby .github/scripts/check_terms.rb
      - name: Content gate (article structure, citations, figures)
        run: ruby .github/scripts/check_content.rb
      - name: Plugin gate (skills up to date, version bump)
        run: ruby .github/scripts/check_plugin.rb ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/requirements.txt
      - name: Code gate (run every code example; output, charts, notebooks up to date)
        run: |
          python -m pip install -r examples/requirements.txt
          python .github/scripts/code_examples.py --check
      - uses: actions/configure-pages@v6
      - name: Build with Jekyll (same gem set as classic GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Site gate (SEO metadata, JSON-LD, links, sitemap, graph.json)
        run: python3 .github/scripts/check_site.py _site
      - name: Preview screenshots (pull requests)
        if: github.event_name == 'pull_request'
        run: .github/scripts/preview_shots.sh _site preview/screenshots origin/${{ github.base_ref }}
      - name: Upload preview (built site + screenshots)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: |
            _site
            preview
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'

  plugin:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate marketplace and plugin with Claude Code
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .
          npx --yes @anthropic-ai/claude-code plugin validate ./plugins/wildbionics

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, plugin]
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Submit URLs to IndexNow
        run: python3 .github/scripts/indexnow.py
