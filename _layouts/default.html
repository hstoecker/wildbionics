<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.ref %}{% assign translations = site.pages | where: "ref", page.ref %}{% for t in translations %}
  <link rel="alternate" hreflang="{{ t.lang }}" href="{{ t.url | absolute_url }}">{% if t.lang == "en" %}
  <link rel="alternate" hreflang="x-default" href="{{ t.url | absolute_url }}">{% endif %}{% endfor %}{% endif %}
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
