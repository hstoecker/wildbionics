title: WildBionics
description: "Nature's physics, explained."
url: "https://wildbionics.com"
lang: en
languages: [en, de]   # first entry lives at the site root
repository_url: "https://github.com/hstoecker/wildbionics"
contact_domain: "wildbionics.com"   # e-mail domain (_includes/email.html), independent of url

# Dates in front matter (date:, updated:) are calendar days in Germany, where the site is
# edited. Without this, Jekyll uses the build machine's zone (UTC in CI) and skips an
# article dated "today" as a future post when CI runs before midnight UTC.
timezone: Europe/Berlin

# IndexNow (https://www.indexnow.org): the key is public by design and must be
# served at /<key>.txt. The deploy workflow reads it from here.
indexnow_key: "25858893bc7b0d8f97cb8693d857d252"

author:
  name: "Hendrik Stöcker"
  url: "https://github.com/hstoecker"

# Articles: one file per language, linked via `ref` (see CLAUDE.md)
collections:
  articles:
    output: true

defaults:
  - scope: { path: "", type: articles }
    values: { layout: article }

# No theme: the github-pages gem otherwise adds jekyll-theme-primer and ships its unused
# 136 KB assets/css/style.css. All layouts and styles are our own.
theme: null

# Syntax highlighting for code blocks (built into GitHub Pages)
highlighter: rouge
kramdown:
  auto_ids: true
  toc_levels: 2..3

exclude:
  - CLAUDE.md
  - README.md
  - CONTRIBUTING.md
  - AGENTS.md
  - plugins/
  - drafts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
